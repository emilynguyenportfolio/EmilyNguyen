  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,300;0,6..96,400;1,6..96,300;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Outfit:wght@200;300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .ow-tabs {
      display: flex;
      gap: 2rem;
      margin: 0.6rem 0 2.4rem;
      flex-wrap: wrap;
    }
    .ow-tab {
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-mid);
      padding: 0.2rem 0;
      transition: color 0.15s, border-color 0.15s;
    }
    .ow-tab:hover { color: var(--text-dark); }
    .ow-tab.active { color: var(--text-dark); border-bottom-color: var(--text-dark); }
    .ow-nav-row {
      display: flex;
      justify-content: space-between;
      margin-top: 2.5rem;
      padding-bottom: 4rem;
    }
    .ow-nav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: var(--text-mid);
      padding: 0.4rem 0;
      transition: color 0.15s;
    }
    .ow-nav-btn:hover { color: var(--text-dark); }
    .ow-section { border-top: 1px solid var(--border); padding: 3rem 0 0; margin-top: 3rem; }
    .ow-section:first-child { border-top: none; padding-top: 0; margin-top: 0; }
    .ow-section-header { display: flex; align-items: baseline; gap: 2rem; margin-bottom: 1.8rem; }
    .ow-section-header .eyebrow { flex-shrink: 0; }
    .ow-section-header h2 { font-family: 'Bodoni Moda', serif; font-size: clamp(1.4rem, 2.5vw, 2rem); font-weight: 300; font-style: italic; margin: 0; }
    .ow-img-block { width: 100%; margin-bottom: 1.2rem; }
    .ow-img-block img { width: 100%; height: auto; display: block; }
    .g-item img { width: 100%; height: auto; display: block; object-fit: cover; }
  </style>
</head>

      <script>
        (function () {
          var current = 0;
          function showTab(idx) {
            document.getElementById('owPanel' + current).style.display = 'none';
            document.getElementById('owTab' + current).classList.remove('active');
            current = idx;
            var panel = document.getElementById('owPanel' + current);
            panel.style.display = '';
            document.getElementById('owTab' + current).classList.add('active');
            panel.querySelectorAll('.fade-up').forEach(function(el) { el.classList.add('visible'); });
            window.scrollTo({ top: document.querySelector('.ow-tabs').offsetTop - 40, behavior: 'smooth' });
          }
          document.getElementById('owTab0').addEventListener('click', function () { showTab(0); });
          document.getElementById('owTab1').addEventListener('click', function () { showTab(1); });
          document.getElementById('owTo1').addEventListener('click', function () { showTab(1); });
          document.getElementById('owTo0').addEventListener('click', function () { showTab(0); });
        })();
      </script>
