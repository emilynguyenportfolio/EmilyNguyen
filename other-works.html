  <style>
    .ow-tabs {
      display: flex;
      gap: 2rem;
      margin: 0.6rem 0 2.4rem;
      flex-wrap: wrap;
    }
    .ow-tab {
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-mid);
      padding: 0.2rem 0;
      transition: color 0.15s, border-color 0.15s;
    }
    .ow-tab:hover { color: var(--text-dark); }
    .ow-tab.active { color: var(--text-dark); border-bottom-color: var(--text-dark); }
    .ow-nav-row {
      display: flex;
      justify-content: space-between;
      margin-top: 2.5rem;
      padding-bottom: 4rem;
    }
    .ow-nav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: var(--text-mid);
      padding: 0.4rem 0;
      transition: color 0.15s;
    }
    .ow-nav-btn:hover { color: var(--text-dark); }
    .ow-section { border-top: 1px solid var(--border); padding: 3rem 0 0; margin-top: 3rem; }
    .ow-section:first-child { border-top: none; padding-top: 0; margin-top: 0; }
    .ow-section-header { display: flex; align-items: baseline; gap: 2rem; margin-bottom: 1.8rem; }
    .ow-section-header .eyebrow { flex-shrink: 0; }
    .ow-section-header h2 { font-family: 'Bodoni Moda', serif; font-size: clamp(1.4rem, 2.5vw, 2rem); font-weight: 300; font-style: italic; margin: 0; }
    .ow-img-block { max-width: 834px; margin-left: auto; margin-right: auto; margin-bottom: 1.2rem; }
    .ow-img-block img { width: 100%; height: auto; display: block; }
    .g-item img { width: 100%; height: auto; display: block; object-fit: cover; }
    /* lookbook image hover */
    .ir-item { cursor: pointer; }
    .ir-item img { transition: opacity 0.25s; }
    .ir-item:hover img { opacity: 0.82; }
    /* lightbox */
    .ow-lb { position: fixed; inset: 0; z-index: 999; pointer-events: none; }
    .ow-lb.active { pointer-events: all; }
    .ow-lb-bg { position: fixed; inset: 0; background: rgba(242,241,238,0.72); backdrop-filter: blur(6px); opacity: 0; transition: opacity 0.4s ease; z-index: 998; }
    .ow-lb.active .ow-lb-bg { opacity: 1; }
    .ow-lb-close { position: fixed; top: 2rem; right: 2.5rem; z-index: 1002; background: none; border: none; color: rgba(20,19,18,0.4); font-family: 'Outfit', sans-serif; font-size: 0.62rem; font-weight: 200; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; padding: 0; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .ow-lb.active .ow-lb-close { opacity: 1; pointer-events: all; }
    .ow-lb-close:hover { color: rgba(20,19,18,0.85); }
  </style>

  <!-- Lightbox -->

    <button class="ow-lb-close" id="owLbClose">close</button>

  <script src="script.js"></script>

  <script>
  /* ── STYLING LOOKBOOK CANVAS ── */
  (function () {
    var LAYOUT = [
      {"src":"styling/45062DCC-AAD5-45BD-A3CD-577490F4AB1B.jpeg","x":0,"y":165,"w":383},
      {"src":"styling/8664385C-59E2-463B-BD96-E79B1C750882.jpeg","x":418,"y":165,"w":383},
      {"src":"styling/D53565DA-40C3-447C-A10E-DB668EBDEAC9.jpeg","x":834,"y":166,"w":383},
      {"src":"styling/AE45A5B3-D459-4339-9D3A-4A3D437A0EE2.jpeg","x":203,"y":656,"w":808},
      {"src":"styling/16ADBF8B-354B-4D36-B103-0369201E3C60.jpg","x":23,"y":1365,"w":362},
      {"src":"styling/4A8152B1-32F8-450C-B0CB-A177C66092AA.jpg","x":563,"y":1505,"w":644},
      {"src":"styling/841268ED-67D4-426F-8DA5-3E5ABBDD7B00.jpg","x":61,"y":2268,"w":363},
      {"src":"styling/65FC755F-F4EF-4371-AD59-25A30BA1AD1F.jpg","x":491,"y":2565,"w":534}
    ];

    var isEdit = window.location.search.includes('edit');
    var canvas = document.getElementById('stylingCanvas');
    var items = [];

    /* render items */
    LAYOUT.forEach(function (item, idx) {
      var el = document.createElement('div');
      el.className = 'ir-item';
      el.style.cssText = 'position:absolute;left:' + item.x + 'px;top:' + item.y + 'px;width:' + item.w + 'px;' + (isEdit ? 'cursor:move;user-select:none;outline:1px dashed rgba(0,0,0,0.18);' : '');
      el.dataset.src = item.src;
      el.dataset.idx = idx;
      var img = document.createElement('img');
      img.src = item.src; img.style.cssText = 'display:block;width:100%;height:auto;pointer-events:none;';
      el.appendChild(img);
      canvas.appendChild(el);
      items.push(el);
    });

    /* lightbox */
    if (!isEdit) {
      var lb = document.getElementById('owLb');
      var lbBg = document.getElementById('owLbBg');
      var lbClose = document.getElementById('owLbClose');
      var lbFloatImg = null, lbSourceEl = null, lbClosing = false;

      function computeSize(nw, nh) {
        var vw = window.innerWidth, vh = window.innerHeight;
        var maxW = vw * 0.86, maxH = vh * 0.88, ar = nw / nh, w, h;
        if (nw <= maxW && nh <= maxH) { w = nw; h = nh; }
        else if (nw / maxW > nh / maxH) { w = maxW; h = maxW / ar; }
        else { h = maxH; w = maxH * ar; }
        return { w: w, h: h };
      }

      function openLb(el) {
        if (lbClosing || lbFloatImg) return;
        lbSourceEl = el;
        var rect = el.getBoundingClientRect();
        var si = el.querySelector('img');
        var nw = si && si.naturalWidth > 0 ? si.naturalWidth : rect.width;
        var nh = si && si.naturalHeight > 0 ? si.naturalHeight : rect.height;
        var sz = computeSize(nw, nh);
        var vw = window.innerWidth, vh = window.innerHeight;
        var dL = (vw - sz.w) / 2, dT = (vh - sz.h) / 2;
        if (si) { si.style.transition = 'none'; si.style.opacity = '0'; }
        lbFloatImg = document.createElement('img');
        lbFloatImg.src = el.dataset.src;
        lbFloatImg.style.cssText = 'position:fixed;z-index:1001;margin:0;padding:0;border:none;display:block;left:' + rect.left + 'px;top:' + rect.top + 'px;width:' + rect.width + 'px;height:' + rect.height + 'px;transition:none;cursor:pointer;';
        lbFloatImg.addEventListener('click', closeLb);
        document.body.appendChild(lbFloatImg);
        lb.classList.add('active');
        lbFloatImg.offsetHeight;
        var ease = '0.5s cubic-bezier(0.4,0,0.2,1)';
        lbFloatImg.style.transition = 'left ' + ease + ',top ' + ease + ',width ' + ease + ',height ' + ease;
        lbFloatImg.style.left = dL + 'px'; lbFloatImg.style.top = dT + 'px';
        lbFloatImg.style.width = sz.w + 'px'; lbFloatImg.style.height = sz.h + 'px';
      }

      function closeLb() {
        if (lbClosing || !lbFloatImg) return;
        lbClosing = true; lb.classList.remove('active');
        var srcEl = lbSourceEl, fi = lbFloatImg;
        if (srcEl) {
          var rect = srcEl.getBoundingClientRect();
          var ease = '0.44s cubic-bezier(0.4,0,0.2,1)';
          fi.style.transition = 'left ' + ease + ',top ' + ease + ',width ' + ease + ',height ' + ease;
          fi.style.left = rect.left + 'px'; fi.style.top = rect.top + 'px';
          fi.style.width = rect.width + 'px'; fi.style.height = rect.height + 'px';
          var si = srcEl.querySelector('img'), swapped = false, fired = {};
          function doSwap() { if (swapped) return; swapped = true; fi.removeEventListener('transitionend', onProp); fi.style.transition = 'none'; fi.style.opacity = '0'; if (si) { si.style.transition = 'none'; si.style.opacity = '1'; } requestAnimationFrame(function () { if (fi.parentNode) fi.parentNode.removeChild(fi); if (lbFloatImg === fi) lbFloatImg = null; lbSourceEl = null; lbClosing = false; if (si) requestAnimationFrame(function () { si.style.opacity = ''; si.style.transition = ''; }); }); }
          function onProp(e) { fired[e.propertyName] = true; if (fired.left && fired.top && fired.width && fired.height) doSwap(); }
          fi.addEventListener('transitionend', onProp);
          setTimeout(doSwap, 500);
        } else { if (fi.parentNode) fi.parentNode.removeChild(fi); lbFloatImg = null; lbSourceEl = null; lbClosing = false; }
      }

      items.forEach(function (el) {
        el.addEventListener('click', function () { openLb(el); });
      });
      lbClose.addEventListener('click', closeLb);
      lbBg.addEventListener('click', closeLb);
      lbFloatImg && lbFloatImg.addEventListener('click', closeLb);
      lb.addEventListener('click', function (e) { if (e.target === lb || e.target === lbBg) closeLb(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && lb.classList.contains('active')) closeLb(); });
      window.addEventListener('scroll', function () { if (lb.classList.contains('active')) closeLb(); }, { passive: true });
    }

    if (!isEdit) return;

    /* edit bar */
    var s = document.createElement('style');
    s.textContent = '.ir-bar{position:fixed;top:0;left:0;right:0;z-index:10000;height:38px;background:#fafaf8;border-bottom:1px solid #d8d7d4;display:flex;align-items:center;gap:1.5rem;padding:0 2rem;font-family:"Outfit",sans-serif;font-size:0.72rem;}.ir-bar button{background:#1a1a18;color:#f2f1ee;border:none;padding:0.28rem 0.9rem;cursor:pointer;font-family:"Outfit",sans-serif;font-size:0.72rem;letter-spacing:0.08em;}.ir-handle{position:absolute;right:0;bottom:0;width:16px;height:16px;background:#1a1a18;cursor:se-resize;z-index:2;}';
    document.head.appendChild(s);
    var bar = document.createElement('div');
    bar.className = 'ir-bar';
    bar.innerHTML = '<span style="color:#aaa;text-transform:uppercase;letter-spacing:0.12em">layout edit</span><button id="irCopy">Copy Layout</button>';
    document.body.prepend(bar);
    document.body.style.paddingTop = '38px';

    function makeDraggable(el) {
      el.addEventListener('mousedown', function (e) {
        if (e.target.classList.contains('ir-handle')) return;
        e.preventDefault();
        var ox = e.clientX - el.offsetLeft, oy = e.clientY - el.offsetTop;
        function onMove(e) { el.style.left = Math.max(0, e.clientX - ox) + 'px'; el.style.top = Math.max(0, e.clientY - oy) + 'px'; }
        function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }
    function makeResizable(el) {
      var h = document.createElement('div'); h.className = 'ir-handle'; el.appendChild(h);
      h.addEventListener('mousedown', function (e) {
        e.preventDefault(); e.stopPropagation();
        var sx = e.clientX, sw = el.offsetWidth;
        function onMove(e) { el.style.width = Math.max(60, sw + e.clientX - sx) + 'px'; }
        function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    Array.from(canvas.querySelectorAll('.ir-item')).forEach(function (el) {
      makeDraggable(el); makeResizable(el);
    });

    document.getElementById('irCopy').addEventListener('click', function () {
      var out = Array.from(canvas.querySelectorAll('.ir-item')).map(function (el) {
        return { src: el.dataset.src, x: Math.round(parseFloat(el.style.left)), y: Math.round(parseFloat(el.style.top)), w: el.offsetWidth };
      });
      navigator.clipboard.writeText(JSON.stringify(out, null, 2));
      this.textContent = 'Copied!';
      var btn = this; setTimeout(function () { btn.textContent = 'Copy Layout'; }, 2000);
    });
  })();
  </script>
