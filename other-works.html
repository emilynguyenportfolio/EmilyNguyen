<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Other Works — Emily Nguyen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,300;0,6..96,400;1,6..96,300;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Outfit:wght@200;300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .ow-tabs {
      display: flex;
      gap: 2rem;
      margin: 0.6rem 0 2.4rem;
      flex-wrap: wrap;
    }
    .ow-tab {
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-mid);
      padding: 0.2rem 0;
      transition: color 0.15s, border-color 0.15s;
    }
    .ow-tab:hover { color: var(--text-dark); }
    .ow-tab.active { color: var(--text-dark); border-bottom-color: var(--text-dark); }
    .ow-nav-row {
      display: flex;
      justify-content: space-between;
      margin-top: 2.5rem;
      padding-bottom: 4rem;
    }
    .ow-nav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: var(--text-mid);
      padding: 0.4rem 0;
      transition: color 0.15s;
    }
    .ow-nav-btn:hover { color: var(--text-dark); }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar-brand">
      <img src="logo.png" alt="Emily Nguyen logo" class="sidebar-logo" />
      <span class="sidebar-name">emily nguyen.</span>
    </a>
    <nav class="sidebar-nav">
      <ul>
        <li><a href="speak-nearby.html">Senior Thesis</a></li>
        <li><a href="knitwear.html">Knitwear</a></li>
        <li><a href="archive.html">Archive</a></li>
        <li><a href="illustrations.html">Illustrations</a></li>
        <li><a href="other-works.html" class="active">Other Works</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <a href="https://instagram.com/sp1ritdancr" target="_blank" rel="noopener">@sp1ritdancr</a>
    </div>
  </aside>
  <button class="sidebar-toggle" aria-label="menu" onclick="toggleSidebar()">
    <span></span><span></span><span></span>
  </button>

  <div class="content">

    <section class="page-hero">
      <div class="page-hero-block"><div class="img-placeholder"></div></div>
      <div class="sheer-rect page-veil"></div>
      <div class="page-hero-content fade-up">
        <span class="eyebrow">specialties &amp; visual studies</span>
        <h1 class="page-title">Other Works</h1>
        <p class="page-subtitle">jewelry &amp; photography</p>
      </div>
    </section>

    <div class="page-body">

      <div class="ow-tabs fade-up">
        <button class="ow-tab active" id="owTab0">Styling</button>
        <button class="ow-tab" id="owTab1">Jewelry</button>
      </div>

      <!-- Panel 0: Styling -->
      <div class="ow-panel" id="owPanel0">
        <div class="gallery-grid cols-3">
          <div class="g-item wide"><div class="img-placeholder"></div></div>
          <div class="g-item tall"><div class="img-placeholder"></div></div>
          <div class="g-item"><div class="img-placeholder"></div></div>
          <div class="g-item"><div class="img-placeholder"></div></div>
          <div class="g-item"><div class="img-placeholder"></div></div>
          <div class="g-item wide"><div class="img-placeholder"></div></div>
        </div>
        <div class="ow-nav-row">
          <span></span>
          <button class="ow-nav-btn" id="owTo1">Jewelry →</button>
        </div>
      </div>

      <!-- Panel 1: Jewelry -->
      <div class="ow-panel" id="owPanel1" style="display:none">
        <div class="gallery-grid cols-3">
          <div class="g-item wide"><div class="img-placeholder"></div></div>
          <div class="g-item tall"><div class="img-placeholder"></div></div>
          <div class="g-item"><div class="img-placeholder"></div></div>
          <div class="g-item"><div class="img-placeholder"></div></div>
          <div class="g-item"><div class="img-placeholder"></div></div>
          <div class="g-item wide"><div class="img-placeholder"></div></div>
          <div class="g-item"><div class="img-placeholder"></div></div>
        </div>
        <div class="ow-nav-row">
          <button class="ow-nav-btn" id="owTo0">← Styling</button>
          <span></span>
        </div>
      </div>

      <script>
        (function () {
          var current = 0;
          function showTab(idx) {
            document.getElementById('owPanel' + current).style.display = 'none';
            document.getElementById('owTab' + current).classList.remove('active');
            current = idx;
            var panel = document.getElementById('owPanel' + current);
            panel.style.display = '';
            document.getElementById('owTab' + current).classList.add('active');
            panel.querySelectorAll('.fade-up').forEach(function(el) { el.classList.add('visible'); });
            window.scrollTo({ top: document.querySelector('.ow-tabs').offsetTop - 40, behavior: 'smooth' });
          }
          document.getElementById('owTab0').addEventListener('click', function () { showTab(0); });
          document.getElementById('owTab1').addEventListener('click', function () { showTab(1); });
          document.getElementById('owTo1').addEventListener('click', function () { showTab(1); });
          document.getElementById('owTo0').addEventListener('click', function () { showTab(0); });
        })();
      </script>

    </div>

    <footer class="footer">
      <span class="footer-name"><img src="emily%20nguyen%20transparent.png" alt="emily nguyen." class="logo-img logo-img--footer" /></span>
      <div class="footer-links">
        <a href="https://instagram.com/sp1ritdancr" target="_blank" rel="noopener">@sp1ritdancr</a>
        <a href="index.html">home</a>
      </div>
      <span class="footer-copy">© 2026 Emily Nguyen</span>
    </footer>

  </div>

  <script src="script.js"></script>
  <script src="editor.js"></script>
</body>
</html>
