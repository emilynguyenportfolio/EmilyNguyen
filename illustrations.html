  <style>
    .il-tabs { display: flex; gap: 2rem; margin: 0.6rem 0 2.4rem; flex-wrap: wrap; }
    .il-tab { background: none; border: none; border-bottom: 1px solid transparent; cursor: pointer; font-family: var(--font-body); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-mid); padding: 0.2rem 0; transition: color 0.15s, border-color 0.15s; }
    .il-tab:hover { color: var(--text-dark); }
    .il-tab.active { color: var(--text-dark); border-bottom-color: var(--text-dark); }
    .il-nav-row { display: flex; justify-content: space-between; margin-top: 2.5rem; padding-bottom: 4rem; }
    .il-nav-btn { background: none; border: none; cursor: pointer; font-family: var(--font-body); font-size: 0.78rem; letter-spacing: 0.1em; color: var(--text-mid); padding: 0.4rem 0; transition: color 0.15s; }
    .il-nav-btn:hover { color: var(--text-dark); }

    /* ── SCATTER CANVAS ── */
    .il-canvas { position: relative; min-height: 800px; padding: 0 0 6rem; }
    .il-photo-abs { position: absolute; cursor: pointer; }
    .il-photo-abs img { display: block; width: 100%; height: auto; transition: opacity 0.3s ease; pointer-events: none; }
    .il-photo-abs:hover img { opacity: 0.82; }
    .il-canvas.editing .il-photo-abs { cursor: grab; outline: 1px solid rgba(80,120,255,0.35); }
    .il-canvas.editing .il-photo-abs:active { cursor: grabbing; }
    .il-photo-abs .il-resize { display: none; position: absolute; right: -5px; bottom: -5px; width: 14px; height: 14px; background: #5070ff; border-radius: 2px; cursor: se-resize; z-index: 10; }
    .il-canvas.editing .il-photo-abs .il-resize { display: block; }
    .il-photo-abs .il-badge { display: none; position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.65); color: #fff; font-family: monospace; font-size: 9px; padding: 2px 5px; pointer-events: none; z-index: 10; white-space: nowrap; }
    .il-canvas.editing .il-photo-abs .il-badge { display: block; }

    /* ── EDIT BAR ── */
    .il-edit-bar { position: sticky; top: 0; z-index: 200; display: flex; align-items: center; gap: 1rem; padding: 0.7rem 0; background: rgba(242,241,238,0.97); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
    .il-edit-bar button { background: none; border: 1px solid var(--border); font-family: 'Outfit', sans-serif; font-size: 0.6rem; font-weight: 300; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text); padding: 0.4rem 0.9rem; cursor: pointer; transition: background 0.2s, color 0.2s; }
    .il-edit-bar button:hover { background: var(--text-dark); color: var(--bg); }
    .il-edit-bar button.active-edit { background: var(--text-dark); color: var(--bg); border-color: var(--text-dark); }
    .il-edit-hint { font-family: 'Outfit', sans-serif; font-size: 0.58rem; font-weight: 200; letter-spacing: 0.1em; color: var(--text-mid); }

    /* ── LIGHTBOX ── */
    .il-lightbox { position: fixed; inset: 0; z-index: 999; pointer-events: none; }
    .il-lightbox.active { pointer-events: all; }
    .il-lb-bg { position: fixed; inset: 0; background: rgba(242,241,238,0.9); backdrop-filter: blur(8px); z-index: 1000; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
    .il-lightbox.active .il-lb-bg { opacity: 1; }
    .il-lb-close { position: fixed; top: 2rem; right: 2.5rem; z-index: 1002; background: none; border: none; color: rgba(20,19,18,0.4); font-family: 'Outfit', sans-serif; font-size: 0.62rem; font-weight: 200; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; padding: 0; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, color 0.2s; }
    .il-lightbox.active .il-lb-close { opacity: 1; pointer-events: all; }
    .il-lb-close:hover { color: rgba(20,19,18,0.85); }
    .il-lb-prev, .il-lb-next { position: fixed; top: 50%; transform: translateY(-50%); z-index: 1002; background: none; border: none; color: rgba(20,19,18,0.28); font-size: 1.1rem; cursor: pointer; padding: 1.2rem; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, color 0.2s; }
    .il-lightbox.active .il-lb-prev, .il-lightbox.active .il-lb-next { opacity: 1; pointer-events: all; }
    .il-lb-prev:hover, .il-lb-next:hover { color: rgba(20,19,18,0.75); }
    .il-lb-prev { left: 1rem; }
    .il-lb-next { right: 1rem; }
    .il-lb-counter { position: fixed; bottom: 1.8rem; left: 50%; transform: translateX(-50%); z-index: 1002; font-family: 'Outfit', sans-serif; font-size: 0.58rem; font-weight: 200; letter-spacing: 0.15em; color: rgba(20,19,18,0.3); opacity: 0; transition: opacity 0.25s ease; }
    .il-lightbox.active .il-lb-counter { opacity: 1; }
  </style>

  <script>
  /* ── ILLUSTRATIONS SCATTER SYSTEM ── */
  (function () {

    /* ── FILE LISTS ── */
    var FASHION_FOLDER = 'illustrations/';
    var FASHION_FILES = [
      '210FFCE1-B058-4F23-A5EE-1D9BF2339E8C.jpg',
      '223124F1-F0AA-474A-B470-C0CF965D35FD.jpg',

      'IMG_7881.jpeg','IMG_7882.jpeg','IMG_7885.jpeg','IMG_7886.jpeg','IMG_7887.jpeg',
      'IMG_8122.jpeg','IMG_8125.jpeg','IMG_8127.jpeg','IMG_8128.jpeg','IMG_8129.jpeg',
      'IMG_8132.jpeg','IMG_8133.jpeg','IMG_8134.jpeg','IMG_8135.jpeg','IMG_8136.jpeg','IMG_8137.jpeg','IMG_8138.jpeg',
      'IMG_8476.jpeg','IMG_8479.jpeg','IMG_8502.jpeg','IMG_8503.jpeg','IMG_8518.jpeg',
      'IMG_8555.jpeg','IMG_8564.jpeg','IMG_8601.jpeg','IMG_8602.jpeg','IMG_8620.jpeg','IMG_8808.jpeg',
      'IMG_9430.jpeg','IMG_9433.jpeg','IMG_9445.jpeg',
      'IMG_9457.jpeg','IMG_9458.jpeg','IMG_9459.jpeg','IMG_9460.jpeg','IMG_9461.jpeg',
      'IMG_9467.jpeg','IMG_9474.jpeg','IMG_9478.jpeg','IMG_9480.jpeg',
      'IMG_9482.jpeg','IMG_9483.jpeg','IMG_9485.jpeg','IMG_9487.jpeg','IMG_9507.jpeg',
      'IMG_9764.jpeg','IMG_9840.jpeg','IMG_9841.jpeg','IMG_9842.jpeg',
      'full 15.jpg'
    ];

    var CAD_FOLDER = 'illustrations/digital:cad/';
    var CAD_FILES = [
      'IMG_0418.jpeg','IMG_0419.jpeg','IMG_0420.jpeg','IMG_0421.jpeg','IMG_0422.jpeg',
      'IMG_0521.PNG','IMG_0537.PNG','IMG_0553.PNG','IMG_0570.PNG','IMG_0630.PNG',
      'IMG_0663.PNG','IMG_0664.PNG','IMG_0679.PNG','IMG_0695.PNG',
      'IMG_0706.PNG','IMG_0707.PNG','IMG_0708.PNG','IMG_0721.PNG','IMG_0906.PNG'
    ];

    var SAVE_KEYS = ['il-fashion-layout-v1', 'il-cad-layout-v1'];
    var HARDCODED = [null, null]; /* filled by auto-generate on first load */
    var FOLDERS  = [FASHION_FOLDER, CAD_FOLDER];
    var FILE_SETS = [FASHION_FILES, CAD_FILES];
    var SRC_SETS = [
      FASHION_FILES.map(function(f){ return FASHION_FOLDER + encodeURIComponent(f); }),
      CAD_FILES.map(function(f){ return CAD_FOLDER + encodeURIComponent(f); })
    ];

    /* ── DETERMINISTIC AUTO-LAYOUT ── */
    function pr(s) { var x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
    function genLayout(n) {
      var colX = [0, 400, 790], colY = [20, 100, 50];
      var layout = [];
      for (var i = 0; i < n; i++) {
        var c = i % 3;
        var w = 240 + Math.floor(pr(i * 3 + 1) * 130);
        var xOff = Math.floor(pr(i * 7 + 2) * 60);
        layout.push({ fileIdx: i, x: colX[c] + xOff, y: colY[c], w: w, h: 300 });
        colY[c] += Math.floor(w * 1.45) + 30 + Math.floor(pr(i * 11 + 3) * 50);
      }
      return layout;
    }

    /* ── ACTIVE PANEL STATE ── */
    var activePanel = 0; /* 0 = fashion, 1 = cad */
    var isEditing = false;
    var layouts = [null, null]; /* current working layout per panel */
    var photoElMaps = [{}, {}];
    var visualOrders = [[], []];

    /* ── LIGHTBOX STATE ── */
    var lb = document.getElementById('ilLightbox');
    var lbBg = document.getElementById('ilLbBg');
    var lbClose = document.getElementById('ilLbClose');
    var lbPrev = document.getElementById('ilLbPrev');
    var lbNext = document.getElementById('ilLbNext');
    var lbCtr = document.getElementById('ilLbCounter');
    var lbClosing = false, lbFloatImg = null, lbSourceEl = null, lbCurrentIdx = 0;
    var lbPanelIdx = 0; /* which panel's lightbox is open */

    /* ── RENDER ── */
    function buildVisualOrder(panelIdx, layout) {
      visualOrders[panelIdx] = layout.slice().sort(function(a,b){ return a.y - b.y; }).map(function(item){ return item.fileIdx; });
    }

    function renderPanel(panelIdx, layout, editing) {
      buildVisualOrder(panelIdx, layout);
      layouts[panelIdx] = layout;
      photoElMaps[panelIdx] = {};
      var canvas = document.getElementById('ilCanvas' + panelIdx);
      canvas.innerHTML = '';
      canvas.className = 'il-canvas' + (editing ? ' editing' : '');
      var maxBottom = 0;
      layout.forEach(function(item){ maxBottom = Math.max(maxBottom, item.y + item.h + 200); });
      canvas.style.minHeight = maxBottom + 'px';

      layout.forEach(function(item) {
        var el = document.createElement('div');
        el.className = 'il-photo-abs';
        el.style.left = item.x + 'px';
        el.style.top  = item.y + 'px';
        el.style.width = item.w + 'px';

        var img = document.createElement('img');
        img.src = SRC_SETS[panelIdx][item.fileIdx];
        img.alt = '';
        img.loading = 'lazy';

        var badge = document.createElement('div');
        badge.className = 'il-badge';
        badge.textContent = Math.round(item.w) + 'px';

        img.addEventListener('load', function() {
          var bottom = item.y + el.offsetHeight + 200;
          if (bottom > parseFloat(canvas.style.minHeight || 0)) canvas.style.minHeight = bottom + 'px';
          item.h = el.offsetHeight;
        });

        el.appendChild(img);
        var rh = document.createElement('div');
        rh.className = 'il-resize';
        el.appendChild(rh);
        el.appendChild(badge);

        photoElMaps[panelIdx][item.fileIdx] = el;

        if (editing) {
          makeDraggable(panelIdx, el, item, badge, canvas);
          makeResizable(panelIdx, rh, el, item, badge);
        } else {
          (function(pi, fi){ el.addEventListener('click', function(){ openLightbox(pi, fi); }); })(panelIdx, item.fileIdx);
        }
        canvas.appendChild(el);
      });
    }

    function makeDraggable(panelIdx, el, item, badge, canvas) {
      el.addEventListener('mousedown', function(e) {
        if (e.target.classList.contains('il-resize')) return;
        e.preventDefault();
        var sx = e.clientX, sy = e.clientY, sl = item.x, st = item.y;
        el.style.zIndex = '50';
        function onMove(e) {
          item.x = Math.max(0, sl + e.clientX - sx);
          item.y = Math.max(0, st + e.clientY - sy);
          el.style.left = item.x + 'px'; el.style.top = item.y + 'px';
          var bottom = item.y + el.offsetHeight + 200;
          if (bottom > parseFloat(canvas.style.minHeight || 0)) canvas.style.minHeight = bottom + 'px';
        }
        function onUp() { el.style.zIndex = ''; autosave(panelIdx); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    function makeResizable(panelIdx, rh, el, item, badge) {
      rh.addEventListener('mousedown', function(e) {
        e.preventDefault(); e.stopPropagation();
        var sx = e.clientX, sw = item.w;
        function onMove(e) { item.w = Math.max(60, sw + e.clientX - sx); el.style.width = item.w + 'px'; badge.textContent = Math.round(item.w) + 'px'; }
        function onUp() { autosave(panelIdx); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    function autosave(panelIdx) {
      var layout = layouts[panelIdx];
      if (layout) localStorage.setItem(SAVE_KEYS[panelIdx], JSON.stringify(layout));
    }

    function loadSaved(panelIdx) {
      try { var r = localStorage.getItem(SAVE_KEYS[panelIdx]); if (r) return JSON.parse(r); } catch(e) {} return null;
    }

    function getLayout(panelIdx) {
      return loadSaved(panelIdx) || HARDCODED[panelIdx] || genLayout(FILE_SETS[panelIdx].length);
    }

    /* ── EDIT CONTROLS ── */
    window.ilStartEdit = function() {
      activePanel = document.getElementById('ilPanel1').style.display !== 'none' ? 1 : 0;
      renderPanel(activePanel, getLayout(activePanel), true);
      isEditing = true;
      document.getElementById('ilEditBtn').style.display = 'none';
      document.getElementById('ilDoneBtn').style.display = '';
      document.getElementById('ilResetBtn').style.display = '';
      document.getElementById('ilEditHint').style.display = '';
      document.getElementById('ilDoneBtn').classList.add('active-edit');
    };
    window.ilFinishEdit = function() {
      autosave(activePanel);
      renderPanel(activePanel, getLayout(activePanel), false);
      isEditing = false;
      document.getElementById('ilEditBtn').style.display = '';
      document.getElementById('ilDoneBtn').style.display = 'none';
      document.getElementById('ilResetBtn').style.display = 'none';
      document.getElementById('ilEditHint').style.display = 'none';
      document.getElementById('ilDoneBtn').classList.remove('active-edit');
    };
    window.ilResetLayout = function() {
      localStorage.removeItem(SAVE_KEYS[activePanel]);
      renderPanel(activePanel, genLayout(FILE_SETS[activePanel].length), false);
      isEditing = false;
      document.getElementById('ilEditBtn').style.display = '';
      document.getElementById('ilDoneBtn').style.display = 'none';
      document.getElementById('ilResetBtn').style.display = 'none';
      document.getElementById('ilEditHint').style.display = 'none';
      document.getElementById('ilDoneBtn').classList.remove('active-edit');
    };
    window.ilCopyLayout = function() {
      var layout = loadSaved(activePanel) || getLayout(activePanel);
      var panelName = activePanel === 0 ? 'FASHION' : 'CAD';
      var code = 'var IL_' + panelName + '_LAYOUT = ' + JSON.stringify(layout) + ';';
      navigator.clipboard.writeText(code).then(function() {
        var btn = document.getElementById('ilCopyBtn');
        btn.textContent = 'Copied!';
        setTimeout(function(){ btn.textContent = 'Copy layout code'; }, 2000);
      });
    };

    /* ── LIGHTBOX ── */
    function computeFinalSize(nw, nh) {
      var vw = window.innerWidth, vh = window.innerHeight, maxW = vw * 0.86, maxH = vh * 0.88, ar = nw / nh, w, h;
      if (nw <= maxW && nh <= maxH) { w = nw; h = nh; }
      else if ((nw / maxW) > (nh / maxH)) { w = maxW; h = maxW / ar; }
      else { h = maxH; w = maxH * ar; }
      return { w: w, h: h };
    }

    function openLightbox(panelIdx, fileIdx) {
      if (lbClosing || lbFloatImg) return;
      lbPanelIdx = panelIdx;
      lbCurrentIdx = visualOrders[panelIdx].indexOf(fileIdx);
      if (lbCurrentIdx === -1) lbCurrentIdx = 0;
      var srcEl = photoElMaps[panelIdx][fileIdx];
      if (!srcEl) return;
      lbSourceEl = srcEl;
      var rect = srcEl.getBoundingClientRect();
      var srcImg = srcEl.querySelector('img');
      var nw = (srcImg && srcImg.naturalWidth > 0) ? srcImg.naturalWidth : rect.width;
      var nh = (srcImg && srcImg.naturalHeight > 0) ? srcImg.naturalHeight : rect.height;
      var size = computeFinalSize(nw, nh);
      var vw = window.innerWidth, vh = window.innerHeight;
      var dL = (vw - size.w) / 2, dT = (vh - size.h) / 2;
      if (srcImg) { srcImg.style.transition = 'none'; srcImg.style.opacity = '0'; }
      lbFloatImg = document.createElement('img');
      lbFloatImg.src = SRC_SETS[panelIdx][fileIdx];
      lbFloatImg.style.cssText = 'position:fixed;z-index:1001;margin:0;padding:0;border:none;display:block;left:' + rect.left + 'px;top:' + rect.top + 'px;width:' + rect.width + 'px;height:' + rect.height + 'px;transition:none;';
      document.body.appendChild(lbFloatImg);
      lbCtr.textContent = (lbCurrentIdx + 1) + ' / ' + FILE_SETS[panelIdx].length;
      lb.classList.add('active');
      lbFloatImg.offsetHeight;
      var ease = '0.5s cubic-bezier(0.4,0,0.2,1)';
      lbFloatImg.style.transition = 'left ' + ease + ',top ' + ease + ',width ' + ease + ',height ' + ease;
      lbFloatImg.style.left = dL + 'px'; lbFloatImg.style.top = dT + 'px';
      lbFloatImg.style.width = size.w + 'px'; lbFloatImg.style.height = size.h + 'px';
    }

    function closeLightbox() {
      if (lbClosing || !lbFloatImg) return;
      lbClosing = true;
      lb.classList.remove('active');
      var srcEl = lbSourceEl, floatImg = lbFloatImg;
      if (srcEl) {
        var rect = srcEl.getBoundingClientRect();
        var ease = '0.44s cubic-bezier(0.4,0,0.2,1)';
        floatImg.style.transition = 'left ' + ease + ',top ' + ease + ',width ' + ease + ',height ' + ease;
        floatImg.style.left = rect.left + 'px'; floatImg.style.top = rect.top + 'px';
        floatImg.style.width = rect.width + 'px'; floatImg.style.height = rect.height + 'px';
        var img = srcEl.querySelector('img'), swapped = false;
        function doSwap() {
          if (swapped) return; swapped = true;
          floatImg.style.transition = 'none'; floatImg.style.opacity = '0';
          if (img) { img.style.transition = 'none'; img.style.opacity = '1'; }
          requestAnimationFrame(function() {
            if (floatImg.parentNode) floatImg.parentNode.removeChild(floatImg);
            if (lbFloatImg === floatImg) lbFloatImg = null;
            lbSourceEl = null; lbClosing = false;
            if (img) requestAnimationFrame(function(){ img.style.opacity = ''; img.style.transition = ''; });
          });
        }
        floatImg.addEventListener('transitionend', function handler(e) {
          if (['left','top','width','height'].includes(e.propertyName)) { floatImg.removeEventListener('transitionend', handler); doSwap(); }
        });
        setTimeout(doSwap, 500);
      } else {
        if (floatImg.parentNode) floatImg.parentNode.removeChild(floatImg);
        lbFloatImg = null; lbSourceEl = null; lbClosing = false;
      }
    }

    function navigateLb(dir) {
      if (!lbFloatImg || lbClosing) return;
      var panelIdx = lbPanelIdx;
      var vo = visualOrders[panelIdx];
      if (lbSourceEl) { var oi = lbSourceEl.querySelector('img'); if (oi) oi.style.opacity = ''; }
      lbCurrentIdx = (lbCurrentIdx + dir + vo.length) % vo.length;
      var fileIdx = vo[lbCurrentIdx];
      lbSourceEl = photoElMaps[panelIdx][fileIdx] || null;
      if (lbSourceEl) { var ni = lbSourceEl.querySelector('img'); if (ni) ni.style.opacity = '0'; }
      var floatImg = lbFloatImg;
      floatImg.style.transition = 'opacity 0.15s ease'; floatImg.style.opacity = '0';
      var nextSrc = SRC_SETS[panelIdx][fileIdx];
      setTimeout(function() { if (floatImg === lbFloatImg) { floatImg.src = nextSrc; floatImg.style.opacity = '1'; } }, 150);
      lbCtr.textContent = (lbCurrentIdx + 1) + ' / ' + FILE_SETS[panelIdx].length;
    }

    lbClose.addEventListener('click', closeLightbox);
    lbBg.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', function(e){ e.stopPropagation(); navigateLb(-1); });
    lbNext.addEventListener('click', function(e){ e.stopPropagation(); navigateLb(1); });
    document.addEventListener('keydown', function(e) {
      if (!lb.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigateLb(-1);
      if (e.key === 'ArrowRight') navigateLb(1);
    });
    window.addEventListener('scroll', function() { if (lb.classList.contains('active')) closeLightbox(); }, { passive: true });

    /* ── INIT ── */
    if (location.search.includes('edit')) {
      document.getElementById('ilEditBar').style.display = 'flex';
      document.getElementById('ilCopyBtn').style.display = '';
    }

    renderPanel(0, getLayout(0), false);
    renderPanel(1, getLayout(1), false);

  })();
  </script>

</body>
</html>
