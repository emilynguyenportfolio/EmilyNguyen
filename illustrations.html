  <style>
    /* ── TABS ── */
    .il-tabs { display: flex; gap: 2rem; margin: 0.6rem 0 2.8rem; flex-wrap: wrap; }
    .il-tab { background: none; border: none; border-bottom: 1px solid transparent; cursor: pointer; font-family: var(--font-body); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-mid); padding: 0.2rem 0; transition: color 0.15s, border-color 0.15s; }
    .il-tab:hover { color: var(--text-dark); }
    .il-tab.active { color: var(--text-dark); border-bottom-color: var(--text-dark); }

    /* ── SECTION LABELS ── */
    .il-section { margin-bottom: 4rem; }
    .il-section-label { font-family: 'Outfit', sans-serif; font-size: 0.62rem; font-weight: 200; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-mid); margin-bottom: 1.4rem; }

    /* ── FEATURED CAROUSEL ── */
    .il-fc { max-width: 820px; }
    .il-fc-clip { overflow: hidden; border-radius: 1px; }
    .il-fc-track { display: flex; transition: transform 0.48s cubic-bezier(0.4,0,0.2,1); }
    .il-fc-slide { flex: 0 0 100%; display: flex; justify-content: center; align-items: flex-start; }
    .il-fc-slide img { max-width: 100%; max-height: 580px; width: auto; height: auto; display: block; cursor: zoom-in; }
    .il-fc-controls { display: flex; align-items: center; gap: 1.4rem; margin-top: 1rem; }
    .il-fc-arrow { background: rgba(242,241,238,0.85); border: none; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem; color: var(--text-dark); backdrop-filter: blur(4px); transition: background 0.2s, transform 0.2s; flex-shrink: 0; }
    .il-fc-arrow:hover { background: rgba(242,241,238,1); transform: scale(1.08); }
    .il-fc-arrow:disabled { opacity: 0.25; pointer-events: none; }
    .il-fc-ctr { font-family: 'Outfit', sans-serif; font-size: 0.58rem; font-weight: 200; letter-spacing: 0.18em; color: var(--text-mid); }

    /* ── SCATTER CANVAS ── */
    .il-canvas { position: relative; min-height: 900px; padding: 0 0 6rem; }
    .il-photo-abs { position: absolute; cursor: pointer; }
    .il-photo-abs img { display: block; width: 100%; height: auto; transition: opacity 0.3s ease; pointer-events: none; }
    .il-photo-abs:hover img { opacity: 0.82; }
    .il-canvas.editing .il-photo-abs { cursor: grab; outline: 1px solid rgba(80,120,255,0.35); }
    .il-canvas.editing .il-photo-abs:active { cursor: grabbing; }
    .il-photo-abs .il-resize { display: none; position: absolute; right: -5px; bottom: -5px; width: 14px; height: 14px; background: #5070ff; border-radius: 2px; cursor: se-resize; z-index: 10; }
    .il-canvas.editing .il-photo-abs .il-resize { display: block; }
    .il-photo-abs .il-badge { display: none; position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.65); color: #fff; font-family: monospace; font-size: 9px; padding: 2px 5px; pointer-events: none; z-index: 10; white-space: nowrap; }
    .il-canvas.editing .il-photo-abs .il-badge { display: block; }

    /* ── EDIT BAR ── */
    .il-edit-bar { position: sticky; top: 0; z-index: 200; display: flex; align-items: center; gap: 1rem; padding: 0.7rem 0; background: rgba(242,241,238,0.97); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
    .il-edit-bar button { background: none; border: 1px solid var(--border); font-family: 'Outfit', sans-serif; font-size: 0.6rem; font-weight: 300; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text); padding: 0.4rem 0.9rem; cursor: pointer; transition: background 0.2s, color 0.2s; }
    .il-edit-bar button:hover { background: var(--text-dark); color: var(--bg); }
    .il-edit-bar button.active-edit { background: var(--text-dark); color: var(--bg); border-color: var(--text-dark); }
    .il-edit-hint { font-family: 'Outfit', sans-serif; font-size: 0.58rem; font-weight: 200; letter-spacing: 0.1em; color: var(--text-mid); }

    /* ── NAV ROW ── */
    .il-nav-row { display: flex; justify-content: space-between; margin-top: 2.5rem; padding-bottom: 4rem; }
    .il-nav-btn { background: none; border: none; cursor: pointer; font-family: var(--font-body); font-size: 0.78rem; letter-spacing: 0.1em; color: var(--text-mid); padding: 0.4rem 0; transition: color 0.15s; }
    .il-nav-btn:hover { color: var(--text-dark); }

    /* ── LIGHTBOX ── */
    .il-lightbox { position: fixed; inset: 0; z-index: 999; pointer-events: none; }
    .il-lightbox.active { pointer-events: all; }
    .il-lb-bg { position: fixed; inset: 0; background: rgba(242,241,238,0.92); backdrop-filter: blur(8px); z-index: 1000; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
    .il-lightbox.active .il-lb-bg { opacity: 1; }
    .il-lb-close { position: fixed; top: 2rem; right: 2.5rem; z-index: 1002; background: none; border: none; color: rgba(20,19,18,0.4); font-family: 'Outfit', sans-serif; font-size: 0.62rem; font-weight: 200; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; padding: 0; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, color 0.2s; }
    .il-lightbox.active .il-lb-close { opacity: 1; pointer-events: all; }
    .il-lb-close:hover { color: rgba(20,19,18,0.85); }
    .il-lb-prev, .il-lb-next { position: fixed; top: 50%; transform: translateY(-50%); z-index: 1002; background: none; border: none; color: rgba(20,19,18,0.28); font-size: 1.1rem; cursor: pointer; padding: 1.2rem; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, color 0.2s; }
    .il-lightbox.active .il-lb-prev, .il-lightbox.active .il-lb-next { opacity: 1; pointer-events: all; }
    .il-lb-prev:hover, .il-lb-next:hover { color: rgba(20,19,18,0.75); }
    .il-lb-prev { left: 1rem; }
    .il-lb-next { right: 1rem; }
    .il-lb-counter { position: fixed; bottom: 1.8rem; left: 50%; transform: translateX(-50%); z-index: 1002; font-family: 'Outfit', sans-serif; font-size: 0.58rem; font-weight: 200; letter-spacing: 0.15em; color: rgba(20,19,18,0.3); opacity: 0; transition: opacity 0.25s ease; pointer-events: none; }
    .il-lightbox.active .il-lb-counter { opacity: 1; }

    /* ── LIGHTBOX STATE ── */
    var lb = document.getElementById('ilLightbox');
    var lbBg = document.getElementById('ilLbBg');
    var lbClose = document.getElementById('ilLbClose');
    var lbPrev = document.getElementById('ilLbPrev');
    var lbNext = document.getElementById('ilLbNext');
    var lbCtr = document.getElementById('ilLbCounter');
    var lbFloatImg = null, lbSourceEl = null, lbClosing = false;
    var lbCollection = [], lbIdx = 0;

    function openLightbox(collection, idx, sourceEl) {
      if (lbClosing || lbFloatImg) return;
      lbCollection = collection;
      lbIdx = idx;
      lbSourceEl = sourceEl || null;
      var src = lbCollection[lbIdx];
      var rect = sourceEl ? sourceEl.getBoundingClientRect() : null;
      var doFlip = rect && rect.width > 0 && rect.height > 0;

      lbFloatImg = document.createElement('img');
      lbFloatImg.src = src;
      lbFloatImg.style.cssText = 'position:fixed;z-index:1001;margin:0;padding:0;border:none;display:block;object-fit:contain;transition:none;';

      if (doFlip) {
        lbFloatImg.style.left   = rect.left + 'px';
        lbFloatImg.style.top    = rect.top  + 'px';
        lbFloatImg.style.width  = rect.width + 'px';
        lbFloatImg.style.height = rect.height + 'px';
      } else {
        lbFloatImg.style.opacity = '0';
        var s = computeFinalSize(800, 600);
        lbFloatImg.style.left   = ((window.innerWidth  - s.w) / 2) + 'px';
        lbFloatImg.style.top    = ((window.innerHeight - s.h) / 2) + 'px';
        lbFloatImg.style.width  = s.w + 'px';
        lbFloatImg.style.height = s.h + 'px';
      }
      document.body.appendChild(lbFloatImg);

      if (sourceEl) { var si = sourceEl.querySelector ? sourceEl.querySelector('img') : sourceEl; if (si) si.style.opacity = '0'; }

      lb.classList.add('active');
      lbCtr.textContent = (lbIdx + 1) + ' / ' + lbCollection.length;

      lbFloatImg.offsetHeight;
      if (doFlip) {
        lbFloatImg.addEventListener('load', function positionFinal() {
          lbFloatImg.removeEventListener('load', positionFinal);
          animateToCenter();
        });
        if (lbFloatImg.complete) animateToCenter();
      } else {
        lbFloatImg.addEventListener('load', function() { lbFloatImg.style.transition = 'opacity 0.3s ease'; lbFloatImg.style.opacity = '1'; animateToCenter(); });
        if (lbFloatImg.complete) { lbFloatImg.style.opacity = '1'; animateToCenter(); }
      }
    }

    function animateToCenter() {
      var nw = lbFloatImg.naturalWidth  || 800;
      var nh = lbFloatImg.naturalHeight || 600;
      var s = computeFinalSize(nw, nh);
      var dL = (window.innerWidth  - s.w) / 2;
      var dT = (window.innerHeight - s.h) / 2;
      var ease = '0.5s cubic-bezier(0.4,0,0.2,1)';
      lbFloatImg.style.transition = 'left ' + ease + ',top ' + ease + ',width ' + ease + ',height ' + ease;
      lbFloatImg.style.left = dL + 'px'; lbFloatImg.style.top = dT + 'px';
      lbFloatImg.style.width = s.w + 'px'; lbFloatImg.style.height = s.h + 'px';
    }

    function computeFinalSize(nw, nh) {
      var maxW = window.innerWidth * 0.86, maxH = window.innerHeight * 0.88, ar = nw / nh, w, h;
      if (nw <= maxW && nh <= maxH) { w = nw; h = nh; }
      else if ((nw / maxW) > (nh / maxH)) { w = maxW; h = maxW / ar; }
      else { h = maxH; w = maxH * ar; }
      return { w: w, h: h };
    }

    function closeLightbox() {
      if (lbClosing || !lbFloatImg) return;
      lbClosing = true;
      lb.classList.remove('active');
      var floatImg = lbFloatImg, srcEl = lbSourceEl;
      if (srcEl) {
        var rect = srcEl.getBoundingClientRect();
        var ease = '0.44s cubic-bezier(0.4,0,0.2,1)';
        floatImg.style.transition = 'left ' + ease + ',top ' + ease + ',width ' + ease + ',height ' + ease + ',opacity 0.44s ease';
        floatImg.style.left = rect.left + 'px'; floatImg.style.top = rect.top + 'px';
        floatImg.style.width = rect.width + 'px'; floatImg.style.height = rect.height + 'px';
        var swapped = false;
        function doSwap() {
          if (swapped) return; swapped = true;
          if (floatImg.parentNode) floatImg.parentNode.removeChild(floatImg);
          if (lbFloatImg === floatImg) lbFloatImg = null;
          lbSourceEl = null; lbClosing = false;
          var si = srcEl.querySelector ? srcEl.querySelector('img') : srcEl;
          if (si) { si.style.transition = 'none'; si.style.opacity = ''; }
        }
        floatImg.addEventListener('transitionend', function h(e){ if (['left','top','width','height'].includes(e.propertyName)){ floatImg.removeEventListener('transitionend',h); doSwap(); } });
        setTimeout(doSwap, 500);
      } else {
        floatImg.style.transition = 'opacity 0.25s ease'; floatImg.style.opacity = '0';
        setTimeout(function(){ if (floatImg.parentNode) floatImg.parentNode.removeChild(floatImg); lbFloatImg = null; lbClosing = false; }, 280);
      }
    }

    function lbNavigate(dir) {
      if (!lbFloatImg || lbClosing || lbCollection.length < 2) return;
      if (lbSourceEl) {
        var si = lbSourceEl.querySelector ? lbSourceEl.querySelector('img') : lbSourceEl;
        if (si) si.style.opacity = '';
      }
      lbIdx = (lbIdx + dir + lbCollection.length) % lbCollection.length;
      lbSourceEl = null;
      var floatImg = lbFloatImg;
      floatImg.style.transition = 'opacity 0.15s ease'; floatImg.style.opacity = '0';
      setTimeout(function() {
        if (floatImg !== lbFloatImg) return;
        floatImg.src = lbCollection[lbIdx];
        floatImg.style.transition = 'opacity 0.15s ease'; floatImg.style.opacity = '1';
      }, 160);
      lbCtr.textContent = (lbIdx + 1) + ' / ' + lbCollection.length;
    }

    lbClose.addEventListener('click', closeLightbox);
    lbBg.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', function(e){ e.stopPropagation(); lbNavigate(-1); });
    lbNext.addEventListener('click', function(e){ e.stopPropagation(); lbNavigate(1); });
    document.addEventListener('keydown', function(e){
      if (!lb.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') lbNavigate(-1);
      if (e.key === 'ArrowRight') lbNavigate(1);
    });
    window.addEventListener('scroll', function(){ if (lb.classList.contains('active')) closeLightbox(); }, { passive: true });

    /* ── CAROUSELS ── */
    function buildCarousel(files, folder, trackId, prevId, nextId, ctrId) {
      var track = document.getElementById(trackId);
      var prev  = document.getElementById(prevId);
      var next  = document.getElementById(nextId);
      var ctr   = document.getElementById(ctrId);
      var srcs  = files.map(function(f){ return folder + encodeURIComponent(f); });
      var slides = [];

      srcs.forEach(function(src) {
        var slide = document.createElement('div');
        slide.className = 'il-fc-slide';
        var img = document.createElement('img');
        img.src = src; img.loading = 'lazy';
        slide.appendChild(img);
        track.appendChild(slide);
        slides.push(slide);
      });

      var idx = 0, total = slides.length;
      function go(n) {
        idx = (n + total) % total;
        track.style.transform = 'translateX(-' + (idx * 100) + '%)';
        ctr.textContent = (idx + 1) + ' / ' + total;
        prev.disabled = false; next.disabled = false;
      }
      prev.addEventListener('click', function(){ go(idx - 1); });
      next.addEventListener('click', function(){ go(idx + 1); });

      slides.forEach(function(slide, i) {
        slide.querySelector('img').style.cursor = 'zoom-in';
        slide.addEventListener('click', function() {
          openLightbox(srcs, i, slide.querySelector('img'));
        });
      });
      go(0);
    }

    buildCarousel(LOOK_FILES,  F, 'lookTrack',  'lookPrev',  'lookNext',  'lookCtr');
    buildCarousel(PRINT_FILES, F, 'printTrack', 'printPrev', 'printNext', 'printCtr');

    /* ── SCATTER AUTO-LAYOUT ── */
    function pr(s) { var x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
    function genScatterLayout(n) {
      var cols = [
        { x: 0,   y: 0 },
        { x: 400, y: 120 },
        { x: 790, y: 40 }
      ];
      var layout = [];
      for (var i = 0; i < n; i++) {
        var c = i % 3;
        var w = 260 + Math.floor(pr(i * 3 + 1) * 110);
        var xOff = Math.floor(pr(i * 7 + 2) * 80);
        layout.push({ fileIdx: i, x: cols[c].x + xOff, y: cols[c].y, w: w });
        cols[c].y += Math.floor(w * 1.38) + 80 + Math.floor(pr(i * 11 + 3) * 60);
      }
      return layout;
    }

    /* ── SCATTER RENDER ── */
    var scatterEl = null, scatterEditing = false, scatterLayout = null;
    var photoElMap = {};

    function renderScatter(layout, editing) {
      scatterLayout = layout;
      photoElMap = {};
      var canvas = document.getElementById('ilCanvas0');
      canvas.innerHTML = '';
      canvas.className = 'il-canvas' + (editing ? ' editing' : '');
      var maxBottom = 0;
      layout.forEach(function(item) {
        var est = item.y + (item.w * 1.4) + 200;
        if (est > maxBottom) maxBottom = est;
      });
      canvas.style.minHeight = maxBottom + 'px';

      var scatterSrcs = SCATTER_FILES.map(function(f){ return F + encodeURIComponent(f); });

      layout.forEach(function(item) {
        var el = document.createElement('div');
        el.className = 'il-photo-abs';
        el.style.left = item.x + 'px';
        el.style.top  = item.y + 'px';
        el.style.width = item.w + 'px';

        var img = document.createElement('img');
        img.src = scatterSrcs[item.fileIdx];
        img.loading = 'lazy';

        var badge = document.createElement('div');
        badge.className = 'il-badge';
        badge.textContent = Math.round(item.w) + 'px';

        img.addEventListener('load', function() {
          var b = item.y + el.offsetHeight + 200;
          if (b > parseFloat(canvas.style.minHeight || 0)) canvas.style.minHeight = b + 'px';
        });

        el.appendChild(img);
        var rh = document.createElement('div'); rh.className = 'il-resize'; el.appendChild(rh);
        el.appendChild(badge);
        photoElMap[item.fileIdx] = el;

        if (editing) {
          makeDrag(canvas, el, item, badge);
          makeResize(rh, el, item, badge);
        } else {
          (function(pi) {
            el.addEventListener('click', function() {
              var sortedByY = layout.slice().sort(function(a,b){ return a.y - b.y; });
              var coll = sortedByY.map(function(it){ return scatterSrcs[it.fileIdx]; });
              var collIdx = sortedByY.findIndex(function(it){ return it.fileIdx === pi; });
              openLightbox(coll, collIdx, el);
            });
          })(item.fileIdx);
        }
        canvas.appendChild(el);
      });
      scatterEl = canvas;
    }

    function makeDrag(canvas, el, item, badge) {
      el.addEventListener('mousedown', function(e) {
        if (e.target.classList.contains('il-resize')) return;
        e.preventDefault();
        var sx = e.clientX, sy = e.clientY, sl = item.x, st = item.y;
        el.style.zIndex = '50';
        function onMove(e) { item.x = Math.max(0, sl + e.clientX - sx); item.y = Math.max(0, st + e.clientY - sy); el.style.left = item.x + 'px'; el.style.top = item.y + 'px'; var b = item.y + el.offsetHeight + 200; if (b > parseFloat(canvas.style.minHeight||0)) canvas.style.minHeight = b + 'px'; }
        function onUp() { el.style.zIndex = ''; autosaveScatter(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    function makeResize(rh, el, item, badge) {
      rh.addEventListener('mousedown', function(e) {
        e.preventDefault(); e.stopPropagation();
        var sx = e.clientX, sw = item.w;
        function onMove(e) { item.w = Math.max(60, sw + e.clientX - sx); el.style.width = item.w + 'px'; badge.textContent = Math.round(item.w) + 'px'; }
        function onUp() { autosaveScatter(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    function autosaveScatter() { try { localStorage.setItem(SAVE_KEY_SCATTER, JSON.stringify(scatterLayout)); } catch(e){} }
    function loadScatter() { try { var r = localStorage.getItem(SAVE_KEY_SCATTER); if (r) { var p = JSON.parse(r); if (p && p.length) return p; } } catch(e){} return null; }

    /* ── SCATTER EDIT CONTROLS ── */
    window.ilStartEdit = function() {
      var layout = loadScatter() || genScatterLayout(SCATTER_FILES.length);
      renderScatter(layout, true);
      scatterEditing = true;
      document.getElementById('ilEditBtn').style.display = 'none';
      document.getElementById('ilDoneBtn').style.display = '';
      document.getElementById('ilResetBtn').style.display = '';
      document.getElementById('ilEditHint').style.display = '';
      document.getElementById('ilDoneBtn').classList.add('active-edit');
    };
    window.ilFinishEdit = function() {
      autosaveScatter();
      renderScatter(scatterLayout, false);
      scatterEditing = false;
      document.getElementById('ilEditBtn').style.display = '';
      document.getElementById('ilDoneBtn').style.display = 'none';
      document.getElementById('ilResetBtn').style.display = 'none';
      document.getElementById('ilEditHint').style.display = 'none';
      document.getElementById('ilDoneBtn').classList.remove('active-edit');
    };
    window.ilResetLayout = function() {
      localStorage.removeItem(SAVE_KEY_SCATTER);
      renderScatter(genScatterLayout(SCATTER_FILES.length), false);
      scatterEditing = false;
      document.getElementById('ilEditBtn').style.display = '';
      document.getElementById('ilDoneBtn').style.display = 'none';
      document.getElementById('ilResetBtn').style.display = 'none';
      document.getElementById('ilEditHint').style.display = 'none';
      document.getElementById('ilDoneBtn').classList.remove('active-edit');
    };
    window.ilCopyLayout = function() {
      var layout = loadScatter() || scatterLayout;
      navigator.clipboard.writeText(JSON.stringify(layout)).then(function() {
        var btn = document.getElementById('ilCopyBtn');
        btn.textContent = 'Copied!';
        setTimeout(function(){ btn.textContent = 'Copy layout'; }, 2000);
      });
    };

    /* ── CAD SCATTER ── */
    var cadLayout = null, cadPhotoMap = {};
    function pr2(s) { var x = Math.sin(s * 89.3 + 211.5) * 31758.33; return x - Math.floor(x); }
    function genCadLayout(n) {
      var cols = [{ x: 0, y: 0 }, { x: 400, y: 60 }, { x: 800, y: 20 }];
      var layout = [];
      for (var i = 0; i < n; i++) {
        var c = i % 3, w = 260 + Math.floor(pr2(i * 3 + 1) * 120), xOff = Math.floor(pr2(i * 7 + 2) * 70);
        layout.push({ fileIdx: i, x: cols[c].x + xOff, y: cols[c].y, w: w });
        cols[c].y += Math.floor(w * 1.3) + 70 + Math.floor(pr2(i * 11 + 3) * 50);
      }
      return layout;
    }
    function renderCad(layout, editing) {
      cadLayout = layout; cadPhotoMap = {};
      var canvas = document.getElementById('ilCanvas1');
      canvas.innerHTML = '';
      canvas.className = 'il-canvas' + (editing ? ' editing' : '');
      var cadSrcs = CAD_FILES.map(function(f){ return F + encodeURIComponent(f); });
      var maxB = 0;
      layout.forEach(function(item) { var e = item.y + (item.w * 1.4) + 200; if (e > maxB) maxB = e; });
      canvas.style.minHeight = maxB + 'px';
      layout.forEach(function(item) {
        var el = document.createElement('div'); el.className = 'il-photo-abs';
        el.style.left = item.x + 'px'; el.style.top = item.y + 'px'; el.style.width = item.w + 'px';
        var img = document.createElement('img'); img.src = cadSrcs[item.fileIdx]; img.loading = 'lazy';
        var badge = document.createElement('div'); badge.className = 'il-badge'; badge.textContent = Math.round(item.w) + 'px';
        img.addEventListener('load', function() { var b = item.y + el.offsetHeight + 200; if (b > parseFloat(canvas.style.minHeight||0)) canvas.style.minHeight = b + 'px'; });
        el.appendChild(img); var rh = document.createElement('div'); rh.className = 'il-resize'; el.appendChild(rh); el.appendChild(badge);
        cadPhotoMap[item.fileIdx] = el;
        if (!editing) {
          (function(pi){ el.addEventListener('click', function() {
            var coll = cadSrcs; openLightbox(coll, pi, el);
          }); })(item.fileIdx);
        }
        canvas.appendChild(el);
      });
    }

    /* ── INIT ── */
    if (location.search.includes('edit')) {
      document.getElementById('ilEditBar').style.display = 'flex';
      document.getElementById('ilCopyBtn').style.display = '';
    }

    var savedScatter = loadScatter();
    renderScatter(savedScatter || genScatterLayout(SCATTER_FILES.length), false);

    var savedCad; try { var cr = localStorage.getItem(SAVE_KEY_CAD); savedCad = cr ? JSON.parse(cr) : null; } catch(e){}
    renderCad(savedCad || genCadLayout(CAD_FILES.length), false);

  })();
  </script>
