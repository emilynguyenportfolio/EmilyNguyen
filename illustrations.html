  <style>
    /* ── TABS ── */
    .il-tabs { display: flex; gap: 2rem; margin: 0.6rem 0 2.8rem; flex-wrap: wrap; }
    .il-tab { background: none; border: none; border-bottom: 1px solid transparent; cursor: pointer; font-family: var(--font-body); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-mid); padding: 0.2rem 0; transition: color 0.15s, border-color 0.15s; }
    .il-tab:hover { color: var(--text-dark); }
    .il-tab.active { color: var(--text-dark); border-bottom-color: var(--text-dark); }

    /* ── CAROUSEL CANVAS ── */
    .il-canvas { position: relative; width: 100%; }

    /* ── SCATTER IMAGES ── */
    .il-photo-abs { position: absolute; cursor: pointer; }
    .il-photo-abs img { display: block; width: 100%; height: auto; transition: opacity 0.3s ease; pointer-events: none; }
    .il-photo-abs:hover img { opacity: 0.82; }
    .il-canvas.editing .il-photo-abs { cursor: grab; outline: 1px solid rgba(80,120,255,0.3); }
    .il-canvas.editing .il-photo-abs:active { cursor: grabbing; }
    .il-photo-abs .il-resize-ph { display: none; position: absolute; right: -6px; bottom: -6px; width: 14px; height: 14px; background: #5070ff; border-radius: 2px; cursor: se-resize; z-index: 10; }
    .il-canvas.editing .il-photo-abs .il-resize-ph { display: block; }

    /* ── CAROUSEL BLOCK ── */
    .il-carblock { position: absolute; box-sizing: border-box; }
    .il-carblock-inner { width: 100%; }

    /* carousel clip + track */
    .il-car-frame { position: relative; }
    .il-clip { overflow: hidden; }
    .il-track { display: flex; transition: transform 0.48s cubic-bezier(0.4,0,0.2,1); }
    .il-slide { flex: 0 0 100%; display: flex; justify-content: center; align-items: flex-start; }
    .il-slide img { display: block; max-width: 100%; max-height: 440px; width: auto; height: auto; cursor: zoom-in; object-fit: contain; margin: 0 auto; }

    /* side arrows */
    .il-controls { display: flex; justify-content: center; margin-top: 0.5rem; }
    .il-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(242,241,238,0.85); border: none; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.7rem; color: var(--text-dark); backdrop-filter: blur(4px); transition: background 0.2s, transform 0.2s; flex-shrink: 0; z-index: 5; }
    .il-arrow.il-prev { left: -14px; }
    .il-arrow.il-next { right: -14px; }
    .il-arrow:hover { background: rgba(242,241,238,1); }
    .il-ctr { font-family: 'Outfit', sans-serif; font-size: 0.56rem; font-weight: 200; letter-spacing: 0.18em; color: var(--text-mid); }

    /* ── EDIT MODE ── */
    .il-canvas.editing .il-carblock { outline: 1px solid rgba(80,120,255,0.3); cursor: grab; }
    .il-canvas.editing .il-carblock:active { cursor: grabbing; }
    .il-canvas.editing .il-slide img { cursor: default; pointer-events: none; }
    .il-canvas.editing .il-arrow { pointer-events: none; opacity: 0.4; }

    .il-resize-handle { display: none; position: absolute; right: -6px; top: 0; bottom: 0; width: 12px; cursor: ew-resize; z-index: 20; }
    .il-resize-handle::after { content: ''; position: absolute; right: 3px; top: 50%; transform: translateY(-50%); height: 40px; width: 3px; background: rgba(80,120,255,0.5); border-radius: 2px; }
    .il-canvas.editing .il-resize-handle { display: block; }

    .il-block-badge { display: none; position: absolute; top: 4px; left: 4px; background: rgba(80,120,255,0.75); color: #fff; font-family: monospace; font-size: 9px; padding: 2px 6px; pointer-events: none; z-index: 10; white-space: nowrap; border-radius: 2px; }
    .il-canvas.editing .il-block-badge { display: block; }

    /* ── EDIT BAR ── */
    .il-edit-bar { position: sticky; top: 0; z-index: 200; display: flex; align-items: center; gap: 1rem; padding: 0.7rem 0; background: rgba(242,241,238,0.97); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
    .il-edit-bar button { background: none; border: 1px solid var(--border); font-family: 'Outfit', sans-serif; font-size: 0.6rem; font-weight: 300; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text); padding: 0.4rem 0.9rem; cursor: pointer; transition: background 0.2s, color 0.2s; }
    .il-edit-bar button:hover { background: var(--text-dark); color: var(--bg); }
    .il-edit-bar button.active-edit { background: var(--text-dark); color: var(--bg); border-color: var(--text-dark); }
    .il-edit-hint { font-family: 'Outfit', sans-serif; font-size: 0.58rem; font-weight: 200; letter-spacing: 0.1em; color: var(--text-mid); }

    /* ── NAV ROW ── */
    .il-nav-row { display: flex; justify-content: space-between; padding-bottom: 4rem; }
    .il-nav-btn { background: none; border: none; cursor: pointer; font-family: var(--font-body); font-size: 0.78rem; letter-spacing: 0.1em; color: var(--text-mid); padding: 0.4rem 0; transition: color 0.15s; }
    .il-nav-btn:hover { color: var(--text-dark); }

    /* ── LIGHTBOX ── */
    .il-lightbox { position: fixed; inset: 0; z-index: 999; pointer-events: none; }
    .il-lightbox.active { pointer-events: all; }
    .il-lb-bg { position: fixed; inset: 0; background: rgba(242,241,238,0.92); backdrop-filter: blur(8px); z-index: 1000; opacity: 0; transition: opacity 0.3s ease; }
    .il-lightbox.active .il-lb-bg { opacity: 1; }
    .il-lb-close { position: fixed; top: 2rem; right: 2.5rem; z-index: 1002; background: none; border: none; color: rgba(20,19,18,0.4); font-family: 'Outfit', sans-serif; font-size: 0.62rem; font-weight: 200; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; padding: 0; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, color 0.2s; }
    .il-lightbox.active .il-lb-close { opacity: 1; pointer-events: all; }
    .il-lb-close:hover { color: rgba(20,19,18,0.85); }
    .il-lb-prev, .il-lb-next { position: fixed; top: 50%; transform: translateY(-50%); z-index: 1002; background: none; border: none; color: rgba(20,19,18,0.28); font-size: 1.1rem; cursor: pointer; padding: 1.2rem; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, color 0.2s; }
    .il-lightbox.active .il-lb-prev, .il-lightbox.active .il-lb-next { opacity: 1; pointer-events: all; }
    .il-lb-prev:hover, .il-lb-next:hover { color: rgba(20,19,18,0.75); }
    .il-lb-prev { left: 1rem; }
    .il-lb-next { right: 1rem; }
    .il-lb-counter { position: fixed; bottom: 1.8rem; left: 50%; transform: translateX(-50%); z-index: 1002; font-family: 'Outfit', sans-serif; font-size: 0.58rem; font-weight: 200; letter-spacing: 0.15em; color: rgba(20,19,18,0.3); opacity: 0; transition: opacity 0.25s ease; pointer-events: none; }
    .il-lightbox.active .il-lb-counter { opacity: 1; }
  </style>

  (function () {
    var current = 0;
    function showTab(idx) {
      document.getElementById('ilPanel' + current).style.display = 'none';
      document.getElementById('ilTab' + current).classList.remove('active');
      current = idx;
      document.getElementById('ilPanel' + current).style.display = '';
      document.getElementById('ilTab' + current).classList.add('active');

    for (var i = 0; i < 2; i++) {
      (function(n){ document.getElementById('ilTab' + n).addEventListener('click', function(){ showTab(n); }); })(i);

  })();

          'IMG_7871.jpeg','IMG_7872.jpeg','IMG_7874.jpeg','IMG_7875.jpeg','IMG_7876.jpeg',
          'IMG_7881.jpeg','IMG_7882.jpeg','IMG_7885.jpeg','IMG_7886.jpeg','IMG_7887.jpeg'
        ]
      },
    ];

    var CAD_GROUPS = [
      {
        label: 'cad',
        folder: 'illustrations/digital:cad/',
        files: [
          'IMG_0418.jpeg','IMG_0419.jpeg','IMG_0420.jpeg',
          'IMG_0421.jpeg','IMG_0422.jpeg','IMG_0906.PNG'
        ]
      },
      {
        label: 'bruxism',
        folder: 'illustrations/digital:cad/bruxism/',
        files: [
          'IMG_0521.PNG','IMG_0537.PNG','IMG_0553.PNG','IMG_0570.PNG','IMG_0630.PNG',
          'IMG_0663.PNG','IMG_0664.PNG','IMG_0679.PNG','IMG_0695.PNG',
          'IMG_0706.PNG','IMG_0707.PNG','IMG_0708.PNG','IMG_0721.PNG'
        ]
      }
    ];

    /* Default layouts: [{x, y, w}, ...] — one entry per group, same index */
    var FASHION_DEFAULT = [
      { x: 0,   y: 885,   w: 700 },
      { x: 4,   y: 5165,  w: 450 },
      { x: 122, y: 10107, w: 620 }
    ];

    var CAD_DEFAULT = [
      { x: 0,  y: 15,  w: 1236 },
      { x: 49, y: 558, w: 1139 }
    ];

    var SAVE_KEY_FASHION = 'il-fashion-canvas-v5';
    var SAVE_KEY_CAD     = 'il-cad-canvas-v7';

    /* ── LIGHTBOX ── */
    var lb       = document.getElementById('ilLightbox');
    var lbBg     = document.getElementById('ilLbBg');
    var lbClose  = document.getElementById('ilLbClose');
    var lbPrev   = document.getElementById('ilLbPrev');
    var lbNext   = document.getElementById('ilLbNext');
    var lbCtr    = document.getElementById('ilLbCounter');
    var lbImg    = null, lbSrcEl = null, lbClosing = false;
    var lbColl   = [], lbIdx = 0;

    function openLB(srcs, idx, srcEl) {
      if (lbClosing || lbImg) return;
      lbColl = srcs; lbIdx = idx; lbSrcEl = srcEl || null;
      var src  = lbColl[lbIdx];
      var rect = srcEl ? srcEl.getBoundingClientRect() : null;
      var flip = rect && rect.width > 0;

      lbImg = document.createElement('img');
      lbImg.src = src;
      lbImg.style.cssText = 'position:fixed;z-index:1001;margin:0;padding:0;border:none;display:block;object-fit:contain;transition:none;';

      if (flip) {
        lbImg.style.left = rect.left + 'px'; lbImg.style.top  = rect.top  + 'px';
        lbImg.style.width = rect.width + 'px'; lbImg.style.height = rect.height + 'px';
      } else {
        lbImg.style.opacity = '0';
        var s = finalSize(800, 600);
        lbImg.style.left = ((innerWidth - s.w) / 2) + 'px'; lbImg.style.top = ((innerHeight - s.h) / 2) + 'px';
        lbImg.style.width = s.w + 'px'; lbImg.style.height = s.h + 'px';
      }
      document.body.appendChild(lbImg);
      if (srcEl) { var si = imgEl(srcEl); if (si) si.style.opacity = '0'; }
      lb.classList.add('active');
      lbCtr.textContent = (lbIdx + 1) + ' / ' + lbColl.length;
      lbImg.offsetHeight;
      if (flip) {
        function doFlip() { animCenter(); }
        lbImg.complete ? doFlip() : lbImg.addEventListener('load', doFlip);
      } else {
        lbImg.complete ? (lbImg.style.opacity='1', animCenter()) : lbImg.addEventListener('load', function(){ lbImg.style.transition='opacity 0.3s'; lbImg.style.opacity='1'; animCenter(); });
      }
    }

    function imgEl(el) { return el.tagName === 'IMG' ? el : el.querySelector('img'); }

    function animCenter() {
      var nw = lbImg.naturalWidth || 800, nh = lbImg.naturalHeight || 600;
      var s = finalSize(nw, nh);
      var e = '0.5s cubic-bezier(0.4,0,0.2,1)';
      lbImg.style.transition = 'left '+e+',top '+e+',width '+e+',height '+e;
      lbImg.style.left = ((innerWidth - s.w) / 2) + 'px'; lbImg.style.top = ((innerHeight - s.h) / 2) + 'px';
      lbImg.style.width = s.w + 'px'; lbImg.style.height = s.h + 'px';
    }

    function finalSize(nw, nh) {
      var mw = innerWidth * 0.86, mh = innerHeight * 0.88, ar = nw / nh, w, h;
      if (nw <= mw && nh <= mh) { w = nw; h = nh; }
      else if (nw/mw > nh/mh) { w = mw; h = mw/ar; }
      else { h = mh; w = mh*ar; }
      return { w: w, h: h };
    }

    function closeLB() {
      if (lbClosing || !lbImg) return;
      lbClosing = true; lb.classList.remove('active');
      var fi = lbImg, se = lbSrcEl;
      if (se) {
        var rect = se.getBoundingClientRect();
        var e = '0.44s cubic-bezier(0.4,0,0.2,1)';
        fi.style.transition = 'left '+e+',top '+e+',width '+e+',height '+e+',opacity 0.44s ease';
        fi.style.left = rect.left+'px'; fi.style.top = rect.top+'px';
        fi.style.width = rect.width+'px'; fi.style.height = rect.height+'px';
        var done = false;
        function finish() { if (done) return; done = true; if (fi.parentNode) fi.parentNode.removeChild(fi); if (lbImg===fi) lbImg=null; lbSrcEl=null; lbClosing=false; var si=imgEl(se); if (si) { si.style.transition='none'; si.style.opacity=''; } }
        fi.addEventListener('transitionend', function h(e){ if (['left','top','width','height'].includes(e.propertyName)){ fi.removeEventListener('transitionend',h); finish(); } });
        setTimeout(finish, 500);
      } else {
        fi.style.transition='opacity 0.25s'; fi.style.opacity='0';
        setTimeout(function(){ if (fi.parentNode) fi.parentNode.removeChild(fi); lbImg=null; lbClosing=false; }, 280);
      }
    }

    function lbNav(dir) {
      if (!lbImg || lbClosing || lbColl.length < 2) return;
      if (lbSrcEl) { var si = imgEl(lbSrcEl); if (si) si.style.opacity = ''; }
      lbIdx = (lbIdx + dir + lbColl.length) % lbColl.length;
      lbSrcEl = null;
      var fi = lbImg;
      fi.style.transition = 'opacity 0.15s'; fi.style.opacity = '0';
      setTimeout(function(){ if (fi !== lbImg) return; fi.src = lbColl[lbIdx]; fi.style.transition='opacity 0.15s'; fi.style.opacity='1'; }, 160);
      lbCtr.textContent = (lbIdx + 1) + ' / ' + lbColl.length;
    }

    lbClose.addEventListener('click', closeLB);
    lbBg.addEventListener('click', closeLB);
    lbPrev.addEventListener('click', function(e){ e.stopPropagation(); lbNav(-1); });
    lbNext.addEventListener('click', function(e){ e.stopPropagation(); lbNav(1); });
    document.addEventListener('keydown', function(e){ if (!lb.classList.contains('active')) return; if (e.key==='Escape') closeLB(); if (e.key==='ArrowLeft') lbNav(-1); if (e.key==='ArrowRight') lbNav(1); });
    window.addEventListener('scroll', function(){ if (lb.classList.contains('active')) closeLB(); }, { passive: true });

    /* ── CAROUSEL BLOCK BUILDER ── */
    function buildBlock(group, pos, isEditing, blockLabel) {
      var srcs = group.files.map(function(f){ return group.folder + encodeURIComponent(f); });
      var block = document.createElement('div');
      block.className = 'il-carblock';
      block.style.left  = pos.x + 'px';
      block.style.top   = pos.y + 'px';
      block.style.width = pos.w + 'px';

      var inner = document.createElement('div');
      inner.className = 'il-carblock-inner';

      /* carousel */
      var clip  = document.createElement('div'); clip.className = 'il-clip';
      var track = document.createElement('div'); track.className = 'il-track';
      srcs.forEach(function(src, i) {
        var slide = document.createElement('div'); slide.className = 'il-slide';
        var img   = document.createElement('img'); img.src = src; img.loading = i === 0 ? 'eager' : 'lazy';
        slide.appendChild(img); track.appendChild(slide);
      });
      clip.appendChild(track);

      /* side arrows + frame */
      var frame = document.createElement('div'); frame.className = 'il-car-frame';
      var prev = document.createElement('button'); prev.className = 'il-arrow il-prev'; prev.innerHTML = '&#8592;';
      var next = document.createElement('button'); next.className = 'il-arrow il-next'; next.innerHTML = '&#8594;';
      frame.appendChild(clip); frame.appendChild(prev); frame.appendChild(next);

      /* counter below */
      var controls = document.createElement('div'); controls.className = 'il-controls';
      var ctr = document.createElement('span'); ctr.className = 'il-ctr';
      controls.appendChild(ctr);

      inner.appendChild(frame); inner.appendChild(controls);

      /* badge for edit mode */
      var badge = document.createElement('div'); badge.className = 'il-block-badge';
      badge.textContent = blockLabel + ' — ' + Math.round(pos.w) + 'px';

      /* resize handle */
      var rh = document.createElement('div'); rh.className = 'il-resize-handle';

      block.appendChild(inner);
      block.appendChild(badge);
      block.appendChild(rh);

      /* carousel state */
      var idx = 0, total = srcs.length;
      function go(n) {
        idx = (n + total) % total;
        track.style.transform = 'translateX(-' + (idx * 100) + '%)';
        ctr.textContent = (idx + 1) + ' / ' + total;
      }
      prev.addEventListener('click', function(e){ e.stopPropagation(); go(idx - 1); });
      next.addEventListener('click', function(e){ e.stopPropagation(); go(idx + 1); });
      go(0);

      /* lightbox on slide click (non-edit) */
      srcs.forEach(function(_, i) {
        track.children[i].addEventListener('click', function(){
          if (track.closest('.il-canvas.editing')) return;
          openLB(srcs, i, track.children[i].querySelector('img'));
        });
      });

      /* drag (edit) */
      block.addEventListener('mousedown', function(e) {
        if (!block.closest('.il-canvas.editing')) return;
        if (e.target === rh || rh.contains(e.target)) return;
        e.preventDefault();
        var sx = e.clientX, sy = e.clientY, ox = pos.x, oy = pos.y;
        block.style.zIndex = '50';
        function onMove(e) { pos.x = Math.max(0, ox + e.clientX - sx); pos.y = Math.max(0, oy + e.clientY - sy); block.style.left = pos.x+'px'; block.style.top = pos.y+'px'; updateBadge(); }
        function onUp()   { block.style.zIndex=''; saveActive(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      /* resize (edit) */
      rh.addEventListener('mousedown', function(e) {
        e.preventDefault(); e.stopPropagation();
        var sx = e.clientX, ow = pos.w;
        function onMove(e) { pos.w = Math.max(120, ow + e.clientX - sx); block.style.width = pos.w+'px'; updateBadge(); }
        function onUp()   { saveActive(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      function updateBadge() { badge.textContent = blockLabel + ' — ' + Math.round(pos.w) + 'px'; }

      return block;
    }

    /* ── CANVAS RENDERER ── */
    var activeCanvasId = null, activeGroups = null, activeLayout = null, activeSaveKey = null;

    function renderCanvas(canvasId, groups, layout, isEditing) {
      var canvas = document.getElementById(canvasId);
      canvas.innerHTML = '';
      canvas.className = 'il-canvas' + (isEditing ? ' editing' : '');

      var maxBottom = 0;
      layout.forEach(function(pos) { var est = pos.y + 800; if (est > maxBottom) maxBottom = est; });
      canvas.style.minHeight = maxBottom + 'px';
      canvas.style.marginBottom = '3rem';

      groups.forEach(function(group, i) {
        var block = buildBlock(group, layout[i], isEditing, group.label);
        canvas.appendChild(block);

        /* update canvas height as images load */
        var firstImg = block.querySelector('img');
        if (firstImg) {
          firstImg.addEventListener('load', function() {
            var b = layout[i].y + block.offsetHeight + 120;
            if (b > parseFloat(canvas.style.minHeight||0)) canvas.style.minHeight = b + 'px';
          });
        }
      });
    }

    /* ── SCATTER DATA ── */
    var SCATTER_FOLDER = 'illustrations/';
    var SCATTER_FILES = [
      '210FFCE1-B058-4F23-A5EE-1D9BF2339E8C.jpg',
      '223124F1-F0AA-474A-B470-C0CF965D35FD.jpg',
      '7CA58E30-7A31-4C05-9B69-9B3C3F83F828.jpg',
      'IMG_5877.jpeg','IMG_6015.jpeg','IMG_6017.jpeg','IMG_6018.jpeg','IMG_6020.jpeg','IMG_6023.jpeg',
      'IMG_6780.jpeg','IMG_6781.jpeg','IMG_6782.jpeg','IMG_6783.jpeg','IMG_6785.jpeg','IMG_6786.jpeg',
      'IMG_7240.jpeg','IMG_7247.jpeg','IMG_7557.jpeg','IMG_7559.jpeg',
      'IMG_8122.jpeg','IMG_8125.jpeg','IMG_8127.jpeg','IMG_8128.jpeg','IMG_8129.jpeg',
      'IMG_8132.jpeg','IMG_8133.jpeg','IMG_8134.jpeg','IMG_8135.jpeg','IMG_8136.jpeg','IMG_8137.jpeg','IMG_8138.jpeg',
      'IMG_8555.jpeg','IMG_8564.jpeg','IMG_8601.jpeg','IMG_8602.jpeg','IMG_8620.jpeg',
      'IMG_9457.jpeg','IMG_9764.jpeg'
    ];
    var SCATTER_SRCS = SCATTER_FILES.map(function(f){ return SCATTER_FOLDER + encodeURIComponent(f); });
    var SAVE_KEY_SCATTER = 'il-fashion-scatter-v9';
    var scatterLayout = null;

    function pr(s) { var x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
    function genScatterLayout(n, startY) {
      var sy = startY || 0;
      /* Columns spaced so max right edge of col N never reaches left edge of col N+1 */
      /* col 0: x=0, w=220-300 → max right 320 | col 1: x=370 | col 2: x=740 */
      var cols = [{ x: 0, y: sy }, { x: 380, y: sy + 120 }, { x: 760, y: sy + 40 }];
      var layout = [];
      var SLOT = 1100; /* fixed slot height — even distribution */
      for (var i = 0; i < n; i++) {
        var c = i % 3;
        var w = 230;   /* fixed width for uniform look */
        layout.push({ fileIdx: i, x: cols[c].x, y: cols[c].y, w: w });
        cols[c].y += SLOT;
      }
      return layout;
    }

    function scatterStartY() { return 0; }

    function renderScatter(layout, isEditing) {
      scatterLayout = layout;
      var canvas = document.getElementById('fashionCanvas');
      /* Remove any existing scatter items before re-adding */
      Array.prototype.forEach.call(canvas.querySelectorAll('.il-photo-abs'), function(el){ el.parentNode.removeChild(el); });
      var maxB = parseFloat(canvas.style.minHeight || 0);
      layout.forEach(function(item) { var e = item.y + item.w * 1.5 + 200; if (e > maxB) maxB = e; });
      canvas.style.minHeight = maxB + 'px';

      layout.forEach(function(item) {
        var el = document.createElement('div');
        el.className = 'il-photo-abs';
        el.style.left  = item.x + 'px';
        el.style.top   = item.y + 'px';
        el.style.width = item.w + 'px';

        var img = document.createElement('img');
        img.src = SCATTER_SRCS[item.fileIdx]; img.loading = 'lazy';
        img.addEventListener('load', function() {
          var b = item.y + el.offsetHeight + 100;
          if (b > parseFloat(canvas.style.minHeight || 0)) canvas.style.minHeight = b + 'px';
        });

        var rh = document.createElement('div'); rh.className = 'il-resize-ph';
        el.appendChild(img); el.appendChild(rh);

        if (isEditing) {
          el.addEventListener('mousedown', function(e) {
            if (e.target === rh || rh.contains(e.target)) return;
            e.preventDefault();
            var sx = e.clientX, sy = e.clientY, ox = item.x, oy = item.y;
            el.style.zIndex = '50';
            function mv(e) { item.x = Math.max(0, ox + e.clientX - sx); item.y = Math.max(0, oy + e.clientY - sy); el.style.left = item.x+'px'; el.style.top = item.y+'px'; }
            function up() { el.style.zIndex=''; saveScatter(); document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); }
            document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
          });
          rh.addEventListener('mousedown', function(e) {
            e.preventDefault(); e.stopPropagation();
            var sx = e.clientX, ow = item.w;
            function mv(e) { item.w = Math.max(60, ow + e.clientX - sx); el.style.width = item.w+'px'; }
            function up() { saveScatter(); document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); }
            document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
          });
        } else {
          (function(pi) {
            el.addEventListener('click', function() {
              var sorted = layout.slice().sort(function(a,b){ return a.y - b.y; });
              var coll   = sorted.map(function(it){ return SCATTER_SRCS[it.fileIdx]; });
              var ci     = sorted.findIndex(function(it){ return it.fileIdx === pi; });
              openLB(coll, ci, el);
            });
          })(item.fileIdx);
        }
        canvas.appendChild(el);
      });
    }

    function saveScatter() { try { localStorage.setItem(SAVE_KEY_SCATTER, JSON.stringify(scatterLayout)); } catch(e){} }
    function loadScatter() { try { var r = localStorage.getItem(SAVE_KEY_SCATTER); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
    var SCATTER_DEFAULT = [{"fileIdx":0,"x":617,"y":330,"w":304},{"fileIdx":1,"x":1036,"y":811,"w":230},{"fileIdx":2,"x":45,"y":17,"w":426},{"fileIdx":3,"x":73,"y":1901,"w":151},{"fileIdx":4,"x":278,"y":1968,"w":408},{"fileIdx":5,"x":861,"y":1432,"w":230},{"fileIdx":6,"x":1075,"y":2769,"w":169},{"fileIdx":7,"x":709,"y":3158,"w":167},{"fileIdx":8,"x":863,"y":2770,"w":195},{"fileIdx":9,"x":892,"y":4084,"w":317},{"fileIdx":10,"x":0,"y":3463,"w":455},{"fileIdx":11,"x":0,"y":3818,"w":455},{"fileIdx":12,"x":344,"y":4579,"w":187},{"fileIdx":13,"x":1052,"y":4934,"w":230},{"fileIdx":14,"x":780,"y":5102,"w":230},{"fileIdx":15,"x":984,"y":5986,"w":201},{"fileIdx":16,"x":706,"y":6048,"w":230},{"fileIdx":17,"x":292,"y":8059,"w":216},{"fileIdx":18,"x":561,"y":7928,"w":289},{"fileIdx":19,"x":472,"y":6661,"w":478},{"fileIdx":20,"x":7,"y":7211,"w":230},{"fileIdx":21,"x":118,"y":7560,"w":179},{"fileIdx":22,"x":951,"y":7517,"w":356},{"fileIdx":23,"x":50,"y":6513,"w":359},{"fileIdx":24,"x":1069,"y":8633,"w":155},{"fileIdx":25,"x":458,"y":8818,"w":230},{"fileIdx":26,"x":0,"y":8529,"w":427},{"fileIdx":27,"x":898,"y":11155,"w":415},{"fileIdx":28,"x":22,"y":9595,"w":230},{"fileIdx":29,"x":928,"y":9154,"w":469},{"fileIdx":30,"x":871,"y":9933,"w":140},{"fileIdx":31,"x":95,"y":11824,"w":230},{"fileIdx":32,"x":364,"y":11903,"w":230},{"fileIdx":33,"x":1026,"y":10847,"w":230},{"fileIdx":34,"x":702,"y":12443,"w":352},{"fileIdx":35,"x":1180,"y":12133,"w":149},{"fileIdx":36,"x":0,"y":12992,"w":289},{"fileIdx":37,"x":329,"y":13152,"w":532}];
    function defaultScatterLayout() { return SCATTER_DEFAULT; }

    /* ── SAVE / LOAD ── */
    function saveLayout(key, layout) { try { localStorage.setItem(key, JSON.stringify(layout)); } catch(e){} }
    function loadLayout(key) { try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
    function deepCopy(obj) { return JSON.parse(JSON.stringify(obj)); }
    function saveActive() { if (activeSaveKey && activeLayout) saveLayout(activeSaveKey, activeLayout); }

    /* ── EDIT MODE ── */
    var isEditing = false;
    var editBtn  = document.getElementById('ilEditBtn');
    var doneBtn  = document.getElementById('ilDoneBtn');
    var resetBtn = document.getElementById('ilResetBtn');
    var copyBtn  = document.getElementById('ilCopyBtn');
    var editHint = document.getElementById('ilEditHint');

    function startEdit() {
      isEditing = true;
      renderCanvas(activeCanvasId, activeGroups, activeLayout, true);
      if (activeCanvasId === 'fashionCanvas') renderScatter(scatterLayout || loadScatter() || defaultScatterLayout(), true);
      editBtn.style.display = 'none'; doneBtn.style.display = ''; resetBtn.style.display = ''; editHint.style.display = '';
    }
    function finishEdit() {
      isEditing = false;
      saveActive();
      renderCanvas(activeCanvasId, activeGroups, activeLayout, false);
      if (activeCanvasId === 'fashionCanvas') { saveScatter(); renderScatter(scatterLayout, false); }
      editBtn.style.display = ''; doneBtn.style.display = 'none'; resetBtn.style.display = 'none'; editHint.style.display = 'none';
    }
    function resetLayout() {
      var defaults = activeCanvasId === 'fashionCanvas' ? FASHION_DEFAULT : CAD_DEFAULT;
      activeLayout = deepCopy(defaults);
      localStorage.removeItem(activeSaveKey);
      renderCanvas(activeCanvasId, activeGroups, activeLayout, false);
      if (activeCanvasId === 'fashionCanvas') { localStorage.removeItem(SAVE_KEY_SCATTER); renderScatter(defaultScatterLayout(), false); }
      isEditing = false;
      editBtn.style.display = ''; doneBtn.style.display = 'none'; resetBtn.style.display = 'none'; editHint.style.display = 'none';
    }

    editBtn.addEventListener('click', startEdit);
    doneBtn.addEventListener('click', finishEdit);
    resetBtn.addEventListener('click', resetLayout);
    copyBtn.addEventListener('click', function() {
      navigator.clipboard.writeText(JSON.stringify(activeLayout)).then(function(){ copyBtn.textContent='Copied!'; setTimeout(function(){ copyBtn.textContent='Copy layout'; }, 2000); });
    });

    /* ── PANEL ACTIVATION ── */
    function activatePanel(canvasId, groups, saveKey, defaultLayout) {
      activeCanvasId = canvasId;
      activeGroups   = groups;
      activeSaveKey  = saveKey;
      var saved = loadLayout(saveKey);
      if (saved && saved.length === groups.length) {
        activeLayout = saved;
      } else {
        activeLayout = deepCopy(defaultLayout);
      }
      if (isEditing) { isEditing = false; editBtn.style.display=''; doneBtn.style.display='none'; resetBtn.style.display='none'; editHint.style.display='none'; }
      renderCanvas(canvasId, groups, activeLayout, false);
    }

    /* ── INIT ── */
    if (location.search.includes('edit')) {
      document.getElementById('ilEditBar').style.display = 'flex';
      copyBtn.style.display = '';
    }

    /* Activate fashion panel by default, then render scatter on top */
    activatePanel('fashionCanvas', FASHION_GROUPS, SAVE_KEY_FASHION, FASHION_DEFAULT);
    var savedScatter = loadScatter();
    renderScatter(savedScatter || defaultScatterLayout(), false);

    function activateFashion() { activatePanel('fashionCanvas', FASHION_GROUPS, SAVE_KEY_FASHION, FASHION_DEFAULT); renderScatter(scatterLayout || loadScatter() || defaultScatterLayout(), false); }
    function activateCad()     { activatePanel('cadCanvas', CAD_GROUPS, SAVE_KEY_CAD, CAD_DEFAULT); }

    /* Switch panels on tab change */
    document.getElementById('ilTab0').addEventListener('click', activateFashion);
    document.getElementById('ilTab1').addEventListener('click', activateCad);
    document.getElementById('ilTo1').addEventListener('click', activateCad);
    document.getElementById('ilTo0').addEventListener('click', activateFashion);

  })();
  </script>
