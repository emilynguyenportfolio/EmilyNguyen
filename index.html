<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>emily nguyen. — portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,300;0,6..96,400;1,6..96,300;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Outfit:wght@200;300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar-brand">
      <img src="logo.png" alt="Emily Nguyen" class="sidebar-logo" />
      <span class="sidebar-name">emily nguyen.</span>
    </a>
    <nav class="sidebar-nav">
      <ul>
        <li><a href="speak-nearby.html">Senior Thesis</a></li>
        <li><a href="knitwear.html">Knitwear</a></li>
        <li><a href="archive.html">Archive</a></li>
        <li><a href="illustrations.html">Illustrations</a></li>
        <li><a href="other-works.html">Styling</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      
    </div>
  </aside>


  <button class="sidebar-toggle" onclick="toggleSidebar()">
    <span></span><span></span><span></span>
  </button>

  <div class="content">

    <!-- HERO — asymmetric, color block right -->
    <section class="hero">
      <div class="hero-block">
        <!-- replace with <img> when ready -->
        <div class="img-placeholder"></div>
      </div>

      <!-- sheer veil crosses into text, partial cover -->
      <div class="sheer-rect hero-veil"></div>

      <!-- text sits under the veil -->
      <div class="hero-text">
        <h1 class="hero-name"><img src="emily%20nguyen%20transparent.png" alt="emily nguyen." class="logo-img logo-img--hero" /></h1>
        <p class="hero-sub">fashion design &nbsp;·&nbsp; visual arts &nbsp;·&nbsp; savannah, georgia</p>
      </div>

    </section>

    <footer class="footer">
      <span class="footer-name"><img src="emily%20nguyen%20transparent.png" alt="emily nguyen." class="logo-img logo-img--footer" /></span>
      <div class="footer-links">
        <a href="contact.html">contact</a>
      </div>
      <span class="footer-copy">© 2026 Emily Nguyen</span>
    </footer>
    <!-- scroll space: panel needs scrollY = 1vh to be fully raised -->
    <div style="height:120vh;"></div>

  </div>

  <!-- fixed panel that rises from below as user scrolls — z-index below sidebar (200) -->
  <div id="snPanel" style="position:fixed;top:0;left:0;right:0;bottom:0;transform:translateY(100%);opacity:0;z-index:190;overflow:hidden;background:#f2f1ee;">
    <iframe src="speak-nearby.html?embed" frameborder="0"
      style="width:100%;height:100%;border:none;display:block;pointer-events:none;"></iframe>
  </div>

  <script src="script.js"></script>
  <script src="editor.js?v=6"></script>
  <script>
  (function () {
    var panel = document.getElementById('snPanel');
    var iframe = panel.querySelector('iframe');
    var entered = false;
    var vh = window.innerHeight;
    window.addEventListener('resize', function () { vh = window.innerHeight; });
    window.addEventListener('scroll', function () {
      if (entered) return;
      var progress = Math.min(1, window.scrollY / vh);
      panel.style.transform = 'translateY(' + ((1 - progress) * 100) + '%)';
      panel.style.opacity = progress;
      if (progress >= 0.96) {
        entered = true;
        panel.style.transform = 'translateY(0)';
        panel.style.opacity = '1';
        /* mark Senior Thesis active in sidebar without reloading */
        [].forEach.call(document.querySelectorAll('.sidebar-nav a'), function (a) {
          a.classList.remove('active');
          if (a.getAttribute('href') === 'speak-nearby.html') a.classList.add('active');
        });
        history.pushState({}, '', 'speak-nearby.html');
        document.title = 'Speak Nearby — Emily Nguyen';
        iframe.style.pointerEvents = 'auto';
      }
    }, { passive: true });
  })();
  </script>
  <button id="backTop" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  <style>
    #backTop { position: fixed; bottom: 5rem; right: 2rem; z-index: 500; width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 1px solid var(--border); background: rgba(242,241,238,0.85); backdrop-filter: blur(6px); color: var(--text-mid); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; opacity: 0; pointer-events: none; transition: opacity 0.3s, color 0.2s; }
    #backTop.visible { opacity: 1; pointer-events: all; }
    #backTop:hover { color: var(--text-dark); }
  </style>
  <script>
  (function () {
    var btn = document.getElementById('backTop');
    window.addEventListener('scroll', function () { btn.classList.toggle('visible', window.scrollY > 300); }, { passive: true });
  })();
  </script>
</body>
</html>
