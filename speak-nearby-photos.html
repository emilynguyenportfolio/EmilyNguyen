  <style>
    .sn-photos-header {
      padding: 5rem 4rem 3rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 2rem;
    }
    .sn-photos-header-left .eyebrow { display: block; margin-bottom: 0.8rem; }
    .sn-photos-header-left h1 {
      font-family: 'Bodoni Moda', serif;
      font-size: clamp(1.8rem, 3.5vw, 3rem);
      font-weight: 300;
      font-style: italic;
      margin: 0;
      line-height: 1.1;
    }
    .sn-photos-credit {
      font-family: 'Outfit', sans-serif;
      font-size: 0.65rem;
      font-weight: 200;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-mid);
      white-space: nowrap;
    }

    /* ── EDIT BAR ── */
    .sn-edit-bar {
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.7rem 4rem;
      background: rgba(242,241,238,0.97);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }
    .sn-edit-bar button {
      background: none;
      border: 1px solid var(--border);
      font-family: 'Outfit', sans-serif;
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .sn-edit-bar button:hover { background: var(--text-dark); color: var(--bg); }
    .sn-edit-bar button.active-edit {
      background: var(--text-dark);
      color: var(--bg);
      border-color: var(--text-dark);
    }
    .sn-edit-hint {
      font-family: 'Outfit', sans-serif;
      font-size: 0.58rem;
      font-weight: 200;
      letter-spacing: 0.1em;
      color: var(--text-mid);
    }

    /* ── FLEX LAYOUT (default) ── */
    .sn-photos-canvas {
      padding: 0 4rem 10rem;
    }
    .sn-photo-row {
      display: flex;
      align-items: flex-start;
    }
    .sn-photo-item {
      flex: 0 0 auto;
      cursor: pointer;
      overflow: hidden;
    }
    .sn-photo-item img {
      display: block;
      width: 100%;
      height: auto;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .sn-photo-item:hover img { opacity: 0.82; }

    /* ── ABSOLUTE LAYOUT (after edit / saved state) ── */
    .sn-photos-canvas.abs-mode {
      position: relative;
      padding: 0;
    }
    .sn-photo-abs {
      position: absolute;
      cursor: pointer;
    }
    .sn-photo-abs img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .sn-photo-abs:hover img { opacity: 0.82; }

    /* ── EDIT HANDLES ── */
    .sn-photos-canvas.editing .sn-photo-abs {
      cursor: grab;
      outline: 1px solid rgba(80,120,255,0.35);
    }
    .sn-photos-canvas.editing .sn-photo-abs:active { cursor: grabbing; }
    .sn-photo-abs .edit-resize {
      display: none;
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 14px;
      height: 14px;
      background: #5070ff;
      border-radius: 2px;
      cursor: se-resize;
      z-index: 10;
    }
    .sn-photos-canvas.editing .sn-photo-abs .edit-resize { display: block; }
    .sn-photo-abs .edit-badge {
      display: none;
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      font-family: monospace;
      font-size: 9px;
      padding: 2px 5px;
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
    }
    .sn-photos-canvas.editing .sn-photo-abs .edit-badge { display: block; }

    /* ── LIGHTBOX ── */
    /* Click-catcher: invisible full-screen layer, below the floating image */
    .sn-lightbox {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
    }
    .sn-lightbox.active { pointer-events: all; }

    /* Controls: above the floating image (z-index 1002 > floatImg 1001) */
    .sn-lightbox-close {
      position: fixed; top: 2rem; right: 2.5rem;
      z-index: 1002;
      background: none; border: none;
      color: rgba(20,19,18,0.4);
      font-family: 'Outfit', sans-serif; font-size: 0.62rem; font-weight: 200;
      letter-spacing: 0.2em; text-transform: uppercase;
      cursor: pointer; padding: 0;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease, color 0.2s;
    }
    .sn-lightbox.active .sn-lightbox-close { opacity: 1; pointer-events: all; }
    .sn-lightbox-close:hover { color: rgba(20,19,18,0.85); }

    .sn-lightbox-prev, .sn-lightbox-next {
      position: fixed; top: 50%; transform: translateY(-50%);
      z-index: 1002;
      background: none; border: none;
      color: rgba(20,19,18,0.28); font-size: 1.1rem;
      cursor: pointer; padding: 1.2rem;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease, color 0.2s;
    }
    .sn-lightbox.active .sn-lightbox-prev,
    .sn-lightbox.active .sn-lightbox-next { opacity: 1; pointer-events: all; }
    .sn-lightbox-prev:hover, .sn-lightbox-next:hover { color: rgba(20,19,18,0.75); }
    .sn-lightbox-prev { left: 1rem; }
    .sn-lightbox-next { right: 1rem; }

    .sn-lightbox-counter {
      position: fixed; bottom: 1.8rem; left: 50%; transform: translateX(-50%);
      z-index: 1002;
      font-family: 'Outfit', sans-serif; font-size: 0.58rem; font-weight: 200;
      letter-spacing: 0.15em; color: rgba(20,19,18,0.3);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .sn-lightbox.active .sn-lightbox-counter { opacity: 1; }

    @media (max-width: 768px) {
      .sn-photos-header { padding: 3rem 1.5rem 2rem; flex-direction: column; gap: 0.5rem; }
      .sn-photos-canvas { padding: 0 1.5rem 6rem; }
      .sn-edit-bar { padding: 0.7rem 1.5rem; }
      .sn-photo-row { flex-wrap: wrap; gap: 4px !important; margin-top: 1.5rem !important; }
      .sn-photo-item { width: 48% !important; margin-left: 0 !important; }
    }
  </style>

          img.loading = 'lazy';

          photoIdx++;
        });
        canvas.appendChild(rowEl);
      });
    }

        var badge = document.createElement('div');
        badge.className = 'edit-badge';
        badge.textContent = Math.round(item.w) + 'px wide';
        el.appendChild(badge);

        photoElMap[item.fileIdx] = el;

        if (editing) {
          makeDraggable(el, item, badge);
          makeResizable(rh, el, item, badge);
        } else {
          (function(idx){ el.addEventListener('click', function(){ openLightbox(idx); }); })(item.fileIdx);
        }

        canvas.appendChild(el);
      });
    }

    // ── DRAG ──
    function makeDraggable(el, item, badge) {
      el.addEventListener('mousedown', function(e) {
        if (e.target.classList.contains('edit-resize')) return;
        e.preventDefault();
        var startX = e.clientX, startY = e.clientY;
        var startLeft = item.x, startTop = item.y;
        el.style.zIndex = '50';

        function onMove(e) {
          item.x = Math.max(0, startLeft + e.clientX - startX);
          item.y = Math.max(0, startTop  + e.clientY - startY);
          el.style.left = item.x + 'px';
          el.style.top  = item.y + 'px';
          // expand canvas if dragged down
          var bottom = item.y + el.offsetHeight + 200;
          if (bottom > parseFloat(canvas.style.minHeight || 0)) {
            canvas.style.minHeight = bottom + 'px';
          }
        }
        function onUp() {
          el.style.zIndex = '';
          autosave();
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    // ── RESIZE ──
    function makeResizable(rh, el, item, badge) {
      rh.addEventListener('mousedown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var startX = e.clientX;
        var startW = item.w;

        function onMove(e) {
          item.w = Math.max(60, startW + e.clientX - startX);
          el.style.width = item.w + 'px';
          badge.textContent = Math.round(item.w) + 'px wide';
        }
        function onUp() {
          autosave();
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    // ── EDIT CONTROLS ──
    window.startEdit = function() {
      // Snapshot current flex layout positions
      var items = canvas.querySelectorAll('.sn-photo-item, .sn-photo-abs');
      var canvasRect = canvas.getBoundingClientRect();
      var layout = [];

      items.forEach(function(el, i) {
        var rect = el.getBoundingClientRect();
        layout.push({
          fileIdx: i,
          x: rect.left - canvasRect.left,
          y: rect.top  - canvasRect.top + window.scrollY - (canvasRect.top + window.scrollY - canvasRect.top),
          w: rect.width,
          h: rect.height
        });
      });

      // Correct y: getBoundingClientRect is viewport-relative; adjust for scroll
      var canvasTop = canvasRect.top + window.scrollY;
      items.forEach(function(el, i) {
        var rect = el.getBoundingClientRect();
        layout[i].y = rect.top + window.scrollY - canvasTop;
      });

      renderAbsolute(layout, true);
      isEditing = true;
      editBtn.style.display = 'none';
      doneBtn.style.display = '';
      resetBtn.style.display = '';
      exportBtn.style.display = '';
      editHint.style.display = '';
      doneBtn.classList.add('active-edit');
    };

    window.finishEdit = function() {
      autosave();
      // Re-render without edit handles
      var saved = loadSaved();
      renderAbsolute(saved, false);
      isEditing = false;
      editBtn.style.display = '';
      doneBtn.style.display = 'none';
      resetBtn.style.display = 'none';
      exportBtn.style.display = '';
      editHint.style.display = 'none';
      doneBtn.classList.remove('active-edit');
    };

    window.resetLayout = function() {
      localStorage.removeItem(SAVE_KEY);
      renderAbsolute(HARDCODED_LAYOUT, false);
      isEditing = false;
      editBtn.style.display = '';
      doneBtn.style.display = 'none';
      resetBtn.style.display = 'none';
      exportBtn.style.display = '';
      editHint.style.display = 'none';
    };

    // ── EXPORT ──
    window.exportLayout = function() {
      var saved = loadSaved();
      if (!saved) { alert('No saved layout yet — make some changes first.'); return; }
      var code = 'var SAVED_LAYOUT = ' + JSON.stringify(saved, null, 2) + ';';
      navigator.clipboard.writeText(code).then(function() {
        var btn = document.getElementById('snExportBtn');
        btn.textContent = 'Copied!';
        setTimeout(function() { btn.textContent = 'Copy layout code'; }, 2000);
      });
    };

    // ── SAVE / LOAD ──
    function autosave() {
      var els = canvas.querySelectorAll('.sn-photo-abs');
      var layout = [];
      els.forEach(function(el, i) {
        layout.push({
          fileIdx: i,
          x: parseFloat(el.style.left),
          y: parseFloat(el.style.top),
          w: parseFloat(el.style.width),
          h: el.offsetHeight
        });
      });
      localStorage.setItem(SAVE_KEY, JSON.stringify(layout));
    }

    function loadSaved() {
      try {
        var raw = localStorage.getItem(SAVE_KEY);
        if (raw) return JSON.parse(raw);
      } catch(e) {}
      return null;
    }

    // ── LIGHTBOX (shared-element / hero transition) ──
    // The image physically lifts out of its spot, moves to center, returns on close.
    var lbClosing = false;
    var lbFloatImg = null;  // fixed-positioned <img> that does the moving
    var lbSourceEl = null;  // the .sn-photo-abs whose img is hidden while open

    function computeFinalSize(naturalW, naturalH) {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var maxW = vw * 0.86;
      var maxH = vh * 0.88;
      var aspect = naturalW / naturalH;
      var w, h;
      if (naturalW <= maxW && naturalH <= maxH) {
        w = naturalW; h = naturalH;
      } else if ((naturalW / maxW) > (naturalH / maxH)) {
        w = maxW; h = maxW / aspect;
      } else {
        h = maxH; w = maxH * aspect;
      }
      return { w: w, h: h };
    }

    function openLightbox(fileIdx) {
      if (lbClosing || lbFloatImg) return;
      currentIdx = visualOrder.indexOf(fileIdx);
      if (currentIdx === -1) currentIdx = fileIdx;
      var actualIdx = (visualOrder[currentIdx] !== undefined) ? visualOrder[currentIdx] : fileIdx;

      lbSourceEl = photoElMap[fileIdx];
      if (!lbSourceEl) return;

      var rect = lbSourceEl.getBoundingClientRect();
      var sourceImg = lbSourceEl.querySelector('img');
      var naturalW = (sourceImg && sourceImg.naturalWidth  > 0) ? sourceImg.naturalWidth  : rect.width;
      var naturalH = (sourceImg && sourceImg.naturalHeight > 0) ? sourceImg.naturalHeight : rect.height;
      var size = computeFinalSize(naturalW, naturalH);
      var vw = window.innerWidth, vh = window.innerHeight;
      var destLeft = (vw - size.w) / 2;
      var destTop  = (vh - size.h) / 2;

      // Blank the original thumbnail instantly (suppress its CSS opacity transition)
      if (sourceImg) {
        sourceImg.style.transition = 'none';
        sourceImg.style.opacity = '0';
      }

      // Create the floating image exactly over the thumbnail
      lbFloatImg = document.createElement('img');
      lbFloatImg.src = srcs[actualIdx];
      lbFloatImg.style.cssText =
        'position:fixed;z-index:1001;margin:0;padding:0;border:none;display:block;' +
        'left:'   + rect.left   + 'px;' +
        'top:'    + rect.top    + 'px;' +
        'width:'  + rect.width  + 'px;' +
        'height:' + rect.height + 'px;' +
        'transition:none;';
      document.body.appendChild(lbFloatImg);

      // Show controls
      lbCtr.textContent = (currentIdx + 1) + ' / ' + FILES.length;
      lightbox.classList.add('active');

      // Force reflow, then animate to center
      lbFloatImg.offsetHeight;
      var ease = '0.5s cubic-bezier(0.4,0,0.2,1)';
      lbFloatImg.style.transition =
        'left ' + ease + ',top ' + ease + ',width ' + ease + ',height ' + ease;
      lbFloatImg.style.left   = destLeft  + 'px';
      lbFloatImg.style.top    = destTop   + 'px';
      lbFloatImg.style.width  = size.w    + 'px';
      lbFloatImg.style.height = size.h    + 'px';
    }

    function closeLightbox() {
      if (lbClosing || !lbFloatImg) return;
      lbClosing = true;
      lightbox.classList.remove('active');

      var sourceEl = lbSourceEl;
      var floatImg = lbFloatImg;

      if (sourceEl) {
        var rect = sourceEl.getBoundingClientRect();
        var ease = '0.44s cubic-bezier(0.4,0,0.2,1)';
        floatImg.style.transition =
          'left ' + ease + ',top ' + ease + ',width ' + ease + ',height ' + ease;
        floatImg.style.left   = rect.left   + 'px';
        floatImg.style.top    = rect.top    + 'px';
        floatImg.style.width  = rect.width  + 'px';
        floatImg.style.height = rect.height + 'px';

        // Wait for ALL 4 properties to finish before swapping
        var img = sourceEl.querySelector('img');
        var fired = {};
        var swapped = false;

        function doSwap() {
          if (swapped) return;
          swapped = true;
          floatImg.removeEventListener('transitionend', onProp);

          // Atomic: float img invisible + thumbnail visible — same paint, no gap
          floatImg.style.transition = 'none';
          floatImg.style.opacity    = '0';
          if (img) { img.style.transition = 'none'; img.style.opacity = '1'; }

          // DOM cleanup happens AFTER that paint (element is already invisible)
          requestAnimationFrame(function() {
            if (floatImg.parentNode) floatImg.parentNode.removeChild(floatImg);
            if (lbFloatImg === floatImg) lbFloatImg = null;
            lbSourceEl = null;
            lbClosing  = false;
            // Restore hover transition after another frame
            if (img) requestAnimationFrame(function() {
              img.style.opacity    = '';
              img.style.transition = '';
            });
          });
        }

        function onProp(e) {
          fired[e.propertyName] = true;
          if (fired.left && fired.top && fired.width && fired.height) doSwap();
        }
        floatImg.addEventListener('transitionend', onProp);
        // Safety fallback in case any transitionend is missed
        setTimeout(doSwap, 500);
      } else {
        if (floatImg.parentNode) floatImg.parentNode.removeChild(floatImg);
        lbFloatImg = null;
        lbSourceEl = null;
        lbClosing = false;
      }
    }

    function navigate(dir) {
      if (!lbFloatImg || lbClosing) return;
      // Restore old source thumbnail
      if (lbSourceEl) {
        var oldImg = lbSourceEl.querySelector('img');
        if (oldImg) oldImg.style.opacity = '';
      }
      currentIdx = (currentIdx + dir + FILES.length) % FILES.length;
      var fileIdx = (visualOrder[currentIdx] !== undefined) ? visualOrder[currentIdx] : currentIdx;
      lbSourceEl = photoElMap[fileIdx] || null;
      // Hide new source thumbnail
      if (lbSourceEl) {
        var newImg = lbSourceEl.querySelector('img');
        if (newImg) newImg.style.opacity = '0';
      }
      // Crossfade the floating image
      var floatImg = lbFloatImg;
      floatImg.style.transition = 'opacity 0.15s ease';
      floatImg.style.opacity = '0';
      var nextSrc = srcs[visualOrder[currentIdx]];
      setTimeout(function() {
        if (floatImg === lbFloatImg) { floatImg.src = nextSrc; floatImg.style.opacity = '1'; }
      }, 150);
      lbCtr.textContent = (currentIdx + 1) + ' / ' + FILES.length;
    }

    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', function(e){ e.stopPropagation(); navigate(-1); });
    lbNext.addEventListener('click', function(e){ e.stopPropagation(); navigate(1); });
    // Click anywhere except the floating image closes it
    lightbox.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', function(e){
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });
    window.addEventListener('scroll', function(){
      if (lightbox.classList.contains('active')) closeLightbox();
    }, { passive: true });
  })();
  </script>
</body>
</html>
